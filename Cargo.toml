[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

# Единая точка версий зависимостей (SPEC §3)
[workspace.dependencies]
# внутренние crates
canvas-core = { path = "crates/canvas-core", version = "0.1.0" }
canvas-render = { path = "crates/canvas-render", version = "0.1.0" }
canvas-shell = { path = "crates/canvas-shell", version = "0.1.0" }
# M8/W4: lib-часть canvas-app (App/AppEvent) — потребляется canvas-web
# (прошивка W4); bin остаётся нативной обёрткой
canvas-app = { path = "crates/canvas-app", version = "0.1.0" }
# MCP-посредник: stdio ↔ named pipe (крейт появился в MCP-задаче)
canvas-mcp = { path = "crates/canvas-mcp", version = "0.1.0" }
# FR-037/ADR-0012: модельный слой сцены + MCP-инструменты (wasm-верификация)
canvas-scene = { path = "crates/canvas-scene", version = "0.1.0" }
# M8/W4 (wasm-port §3.1/§3.5): web-платформенный слой — bindgen-обвязка,
# web-сервисы; лист в DAG, в нативный граф бинарей не входит
canvas-web = { path = "crates/canvas-web", version = "0.1.0" }
# M5: движок виджетов (манифесты, bridge, LOD, реестр, WebView2-хост)
canvas-widgets = { path = "crates/canvas-widgets", version = "0.1.0" }
# FR-051/FR-052 (PRD-0009): каркас canvas-ui — модель экрана (слои, реестр
# поверхностей, capture-политики, HitStack, KeyboardRouter); потребляют
# canvas-render (полосы кадра) и canvas-app (диспетчер ввода)
canvas-ui = { path = "crates/canvas-ui", version = "0.1.0" }
# модель и сериализация
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
# конфиг приложения config.toml (формат предписан T19, docs/TASKS.md)
toml = "0.8"
# spatial index (R-tree) для canvas-core (SPEC §4)
rstar = "0.12"
# тамбнейл-кэш SQLite (SPEC §5.2) — bundled, без системного SQLite
rusqlite = { version = "0.32", features = ["bundled"] }
# логирование
tracing = "0.1"
# файловый вотчер (T10, SPEC §7.5): ReadDirectoryChangesW на Windows,
# inotify на Linux — кроссплатформенные интеграционные тесты
notify = "8.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# окно, рендер, текст (версии по SPEC §3)
winit = "0.30"
# M8/W1 (wasm-port §6): Instant, безопасный на wasm32-unknown-unknown
# (§2 п. 7: std-версия компилируется, но паникует в рантайме); на нативе
# это тонкая обёртка над std. Версия уже в дереве через winit.
web-time = "1.1"
wgpu = "22"
glyphon = "0.6" # совместим с wgpu 22
# инлайн-редактирование текста (T7): та же версия, что тянет glyphon 0.6
cosmic-text = "0.12"
# буфер обмена (T7): без ручного unsafe Win32 clipboard-кода
arboard = "3"
pollster = "0.3"
# M8/W4 (wasm-port §3.5, контрольная сборка §2): JS-глю для браузерной
# сборки canvas-web; на нативных целях макросы раскрываются в заглушки.
# Версия для trunk-сборки: wasm-bindgen-cli 0.2.127 — обязан совпадать
# с Cargo.lock (там =0.2.127 зафоршен js-sys 0.3.104 из winit)
wasm-bindgen = "0.2"
# M8/W6 (wasm-port §4): Promise-мосты (JsFuture) и вызов JS-глю
# (IndexedDB-recent в index.html); версия уже в дереве через wasm-bindgen
js-sys = "0.3"
# M8/W4 (прошивка): async-инициализация Renderer на web — spawn_local
wasm-bindgen-futures = "0.4"
# M8/W4 (прошивка): канвас для winit-окна из index.html (EventLoopBuilder
# ExtWebSys::with_canvas); фичи — у потребителя (canvas-web)
web-sys = "0.3"
# Win32/COM (только canvas-shell / canvas-widgets, под cfg(windows))
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    # T9 drag-drop: STGMEDIUM/GetData (чтение CF_HDROP с IDataObject)
    "Win32_System_Com_StructuredStorage",
    # T9 drag-drop: MODIFIERKEYS_FLAGS в сигнатурах IDropTarget_Impl
    "Win32_System_SystemServices",
    # T9 drag-drop: IDropTarget/RegisterDragDrop/OleInitialize + CF_HDROP
    "Win32_System_Ole",
    # T9 drag-drop: GlobalLock/GlobalSize (снятие байтов CF_HDROP)
    "Win32_System_Memory",
    # T9 drag-drop: резерв под оконные сообщения (ScreenToClient в 0.62 — Gdi)
    "Win32_UI_WindowsAndMessaging",
    # T15: клавиатурный фокус встроенного окна (SetFocus/GetFocus)
    "Win32_UI_Input_KeyboardAndMouse",
    # T15: GetDpiForWindow (DPI-поллинг после репарентинга, R10)
    "Win32_UI_HiDpi",
    # T15: SetWinEventHook/UnhookWinEvent (watch WorkerW, R6)
    "Win32_UI_Accessibility",
    # T15: GetCurrentThreadId (monitor-поток, координатор вместо link!-декларации воркера D)
    "Win32_System_Threading",
    # T16: WTSRegisterSessionNotification/ProcessIdToSessionId (шина shell_events, R8)
    "Win32_System_RemoteDesktop",
    # T16: RegisterSuspendResumeNotification (suspend/resume перед сном, R11)
    "Win32_System_Power",
    # T16: AddClipboardFormatListener (clipboard-канал шины, R11)
    "Win32_System_DataExchange",
    # T16: SHChangeNotifyRegister/Lock, SHGetPathFromIDListW, SHParseDisplayName
    # (SHCNE-мост R12: типы Common::ITEMIDLIST)
    "Win32_UI_Shell_Common",
    # T16: GetModuleHandleW (HINSTANCE окна шины — RegisterClassW/CreateWindowExW;
    # координатор вместо link!-декларации воркера B — тот же путь, что T15-D)
    "Win32_System_LibraryLoader",
    # T17: автозапуск HKCU Run (RegCreateKeyExW/RegSetValueExW/RegDeleteValueW)
    "Win32_System_Registry",
    # MCP: named pipe сервер в canvas-app (CreateNamedPipeW/CreateFileW за
    # Win32_Security, ReadFile/WriteFile — Win32_System_IO) — транспорт
    # канала canvasdesk-mcp → приложение
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_IO",
    # MCP: ConnectNamedPipe/DisconnectNamedPipe/WaitNamedPipeW
    "Win32_System_Pipes",
] }
# #[implement] (T9 COM IDropTarget) генерирует пути ::windows_core —
# нужен прямой dep, re-export windows::core не резолвится
windows-core = "0.62"
# встраивание каталогов в бинарник (шаблоны/виджеты; SPEC §3 — версии
# централизованы, CP0: приведение include_dir/image к конвенции)
include_dir = "0.7"
# декодирование PNG-тамбнейлов виджетов (без default-фич — только png)
image = { version = "0.25", default-features = false, features = ["png"] }

# M8/W12 (wasm-port §6, «Полировка и деплой»): thin LTO в release-профиле —
# бандл canvas-web заметно компактнее, нативные релизные бинари чуть меньше
# и быстрее при приемлемом времени линковки (профиль общий для всех целей:
# cargo не поддерживает wasm-специфичные профили). Основное сжатие wasm даёт
# wasm-opt -Oz — scripts/web_bundle.sh / Pages-workflow (§6 W12).
[profile.release]
lto = "thin"
