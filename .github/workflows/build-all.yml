name: Multi-platform Build

on:
  push:
    branches: ["**"] # публичный pet-проект — сборка бесплатна, можно на все ветки
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch: # ручной запуск из UI при необходимости

env:
  BIN_NAME: canvasdesk # <-- замени на реальное имя из Cargo.toml ([package].name или [[bin]].name)

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # падение на одной ОС не отменяет остальные
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --release --all-features

      - name: Run cargo build
        run: cargo build --release

      # Определяем реальный путь к бинарнику: на Windows он с .exe
      - name: Resolve binary path (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: echo "BIN_PATH=target/release/${{ env.BIN_NAME }}" >> "$GITHUB_ENV"

      - name: Resolve binary path (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "BIN_PATH=target/release/${{ env.BIN_NAME }}.exe" >> "$GITHUB_ENV"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: ${{ env.BIN_PATH }}
          if-no-files-found: error # теперь ошибка не скроется молча
          retention-days: 14 # чтобы артефакты не копились бесконечно
