name: Multi-platform Build

# Релизные артефакты по тегам v* и ручной запуск из UI. Артефакты на
# каждый пуш в main собирает workflow CI (job artifacts) — здесь сборка
# не дублируется.
on:
  push:
    tags: ["v*"] # релизные теги — артефакты версии
  workflow_dispatch: # ручной запуск из UI при необходимости

env:
  BIN_NAME: canvas-app

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # падение на одной ОС не отменяет остальные
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run cargo build
        run: cargo build --release

      # Определяем реальный путь к бинарнику: на Windows он с .exe
      - name: Resolve binary path (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: echo "BIN_PATH=target/release/${{ env.BIN_NAME }}" >> "$GITHUB_ENV"

      - name: Resolve binary path (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "BIN_PATH=target/release/${{ env.BIN_NAME }}.exe" >> "$GITHUB_ENV"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: ${{ env.BIN_PATH }}
          if-no-files-found: error # ошибка не скроется молча
          retention-days: 14 # чтобы артефакты не копились бесконечно
