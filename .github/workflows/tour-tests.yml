name: Tour regression (Playwright)

# FR-028 v2: regression tests for the inline-onboarding engine
# (sdk/web-onboarding/). 11 Playwright tests against
# standalone-test.html via file:// — no Rust/WASM build needed.
# Plus a signal-shim test that verifies JS-side Ctrl+P / dblclick
# → tour signal emission (the fallback for passive+waitFor scenarios
# before Rust-side wiring is implemented).

on:
  push:
    branches: [main]
    paths:
      - 'sdk/web-onboarding/**'
      - 'crates/canvas-web/index.html'
      - '.github/workflows/tour-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sdk/web-onboarding/**'
      - 'crates/canvas-web/index.html'
      - '.github/workflows/tour-tests.yml'
  workflow_dispatch: {}

jobs:
  tour-regression:
    name: Playwright regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.63.0

      - name: Install Chromium browser
        run: python -m playwright install --with-deps chromium

      - name: Verify bundle syntax (node --check)
        run: node --check sdk/web-onboarding/canvasdesk-tour.js

      - name: Verify index.html script blocks syntax
        run: |
          set -e
          python3 - <<'PY'
          import re
          with open('crates/canvas-web/index.html') as f:
              html = f.read()
          scripts = re.findall(r'<script(?:\s+[^>]*)?>(.+?)</script>', html, re.DOTALL)
          for i, s in enumerate(scripts):
              if 'data-cd-tour-bundle' in s:
                  continue
              fname = f'/tmp/_script_{i}.js'
              with open(fname, 'w') as f:
                  f.write(s)
          print(f'Extracted {len(scripts)} script blocks')
          PY
          for f in /tmp/_script_*.js; do
            [ -f "$f" ] && node --check "$f" && echo "OK: $f"
          done

      - name: Run Playwright regression tests
        run: python3 sdk/web-onboarding/tests/test_tour_regression.py

      - name: Run signal-shim test
        run: python3 sdk/web-onboarding/tests/test_signal_shim.py
