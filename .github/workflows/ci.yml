name: CI

# Авторитетный гейт (AGENTS.md «Сборка и тесты»): fmt/clippy/test/build
# на всех трёх целевых ОС — кроссплатформенность Win/Linux/macOS (M7).
# Плюс артефакты: релизные бинари трёх ОС прикладываются к каждому пушу
# в main — свежую сборку можно скачать из Actions без локальной сборки.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # падение одной ОС не отменяет остальные
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: build
        run: cargo build --workspace

  # FR-036 (ADR-0011, W0 плана wasm-port): ядро обязано собираться под
  # wasm32-unknown-unknown — гейт веб-порта M8 (wasm-port.md §3.1,
  # расширение правила «core собирается на Linux») на каждый пуш.
  # Быстрая линукс-джоба без wasmtime: только компиляция (ступени 1–2
  # scripts/wasm_gate.sh); исполнение ядра в wasm-рантайме — ступень 3
  # того же скрипта, локально (wasm32-wasip1 + wasmtime).
  # Расширение FR-037/MW2: мост canvas-mcp входит в wasm-гейт (исполнение
  # тестов моста — локально, ступень 3 scripts/wasm_gate.sh, прецедент ADR-0011).
  # Расширение FR-037/MW4: MCP-слой целиком (canvas-scene, canvas-mcp,
  # canvas-mcp-headless) — компиляция здесь, исполнение тестов и реальная
  # MCP-сессия — локально scripts/mcp_wasm_gate.sh (wasmtime, прецедент ADR-0011).
  # Расширение M8/W12 (wasm-port §6.1 п.4): canvas-web — продуктовый
  # web-слой в wasm-гейте (компиляция здесь = ступень 1 scripts/wasm_gate.sh;
  # бандл/деплой — Pages-workflow pages-web.yml, там же размер в логе).
  wasm-check:
    name: wasm-check (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # FR-079 S3-fix: статический гейт «времени» — std::time::Instant/
      # SystemTime компилируются под wasm32, но паникуют в рантайме
      # («time not implemented» → фриз web). cargo check это не ловит,
      # поэтому аудит идёт первым и не зависит от Rust-тулчейна.
      - name: wasm time audit (W1 — canvas_core::time only)
        run: python3 scripts/wasm_time_audit.py
      - name: check ядра, MCP-слоя и web-слоя под wasm (core/render/widgets/mcp/scene/headless/web)
        run: cargo check --target wasm32-unknown-unknown -p canvas-core -p canvas-render -p canvas-widgets -p canvas-mcp -p canvas-scene -p canvas-mcp-headless -p canvas-web

  # CP0 (волна 0.1 продуктового роадмапа, ADR-0008): лицензионная
  # чистота дерева — гейт на каждый пуш/PR. cargo-deny проверяет
  # licenses/bans/sources/advisories по deny.toml (allowlist архдока
  # §7.2). Быстрая линукс-джоба без сборки: работает по Cargo.lock и
  # метаданным крейтов. Контрольный прогон правила: ветка с запрещённой
  # (copyleft) лицензией в дереве валит эту джобу — сценарий владельца
  # из роадмапа §9 CP0.
  licenses:
    name: licenses (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # LAY-W12→W14 (аудит layouts-2026-10 §5; ревью layouts-w1-w12-review.md
  # §3.1 P1-2, §3.2 P2-5/P2-6): регрессионный гейт LAY7 — python3-сканер
  # без сборки (прецедент wasm_time_audit.py). После ремонта W14:
  # 1. полный скан каждого файла: тестовый код отсекается по mod-границам
  #    (устранена слепая зона app.rs:156/lib.rs:122 ~35 тыс. строк);
  # 2. расширенные паттерны: целые/отрицательные/скобочные gap-литералы
  #    (кроме 0/0.0 — нейтральный ритм «Исключений» 11-layouts.md) и курсоры
  #    x/y += с дробным литералом, включая смешанные `y += CONST + 6.0`;
  # 3. исключения — только инлайн `// lay7:allow <причина>` в строке
  #    (файловый allowlist прежнего гейта удалён);
  # 4. negative-тест гейта --selftest — первым шагом job'ы: PR, ослабляющий
  #    сканер, не позеленит.
  # До волны LAY-W13 job остаётся красным на известных хитах admin_ui.rs
  # (параллельная миграция тел админки на Column-скелет — ревью §3.1 P1-1).
  lay7-lint:
    name: lay7-lint (regression gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: LAY7 selftest (negative-тест гейта)
        run: bash scripts/lay7_lint.sh --selftest
      - name: LAY7 regression lint (gap literals + x/y cursors)
        run: bash scripts/lay7_lint.sh

  # Issue #18 (аудит доков 2026-10-10): гейт целостности документации.
  # scripts/doc_lint.py — python3-сканер без сборки (прецедент
  # wasm_time_audit.py): битые *.md-ссылки, *.html-ссылки на несобранные
  # md-источники вне user-docs/ (FR-031 — html-ссылки user-docs валидны
  # при существовании md-источника). Запрещает регрессию «*.html-ссылки
  # на md-источники» на каждый пуш/PR.
  docs-lint:
    name: docs-lint (link integrity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Документация — целостность ссылок
        run: python3 scripts/doc_lint.py

  # Релизные бинари трёх ОС — только с зелёных гейтов и только на пуш
  # (PR-ы не тратят минуты на загрузку артефактов). Это же — обходной
  # путь при локальной ошибке линковки LNK1104 (docs/ENVIRONMENT.md §8).
  #
  # macOS-ветка (universal2 + .app): голый arm64-бинарник не запускается
  # на Mac — Finder не стартует сырой файл, zip-артефакт теряет exec-бит,
  # карантин Gatekeeper блокирует неподписанное, Intel-Мак не умеет arm64.
  # Решение: оба таргета -> lipo -> CanvasDesk.app + ad-hoc codesign ->
  # tar.gz (сохраняет права и подпись) + инструкция снятия карантина.
  # Смок-тест запускает приложение прямо на раннере (реальный GUI-сеанс
  # с WindowServer) — приёмка macOS без локальной сборки на Mac.
  artifacts:
    name: artifacts (${{ matrix.os }})
    needs: gates # артефакты собираются только с зелёных гейтов
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # CP0 (волна 0.1): SBOM-in-binary — релизные бинари несут полный
      # список зависимостей внутри (cargo-auditable). Извлечение:
      # auditable-extract (рецепт — docs/DEPENDENCIES.md §Рецепты).
      - name: Install cargo-auditable
        run: cargo install cargo-auditable --locked

      # ---- macOS: таргеты universal2 ---------------------------------
      - name: Add Apple targets (macOS)
        if: runner.os == 'MacOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # ---- сборка ------------------------------------------------------
      # Windows добавляет .exe к имени бинарника; Linux — нативный бинарь;
      # macOS — оба слайса отдельно (lipo на шаге пакеджинга).
      # cargo auditable build = обычная сборка + встроенный SBOM.
      - name: build release (Windows/Linux)
        if: runner.os != 'MacOS'
        run: cargo auditable build --release -p canvas-app
      - name: build release arm64 (macOS)
        if: runner.os == 'MacOS'
        run: cargo auditable build --release -p canvas-app --target aarch64-apple-darwin
      - name: build release x86_64 (macOS)
        if: runner.os == 'MacOS'
        run: cargo auditable build --release -p canvas-app --target x86_64-apple-darwin

      # ---- macOS: смок-запуск на раннере (реальный GUI + Metal) -------
      # Проверка «приложение стартует и живёт» без Mac у разработчика:
      # у macos-latest есть WindowServer/GPU, winit+wgpu работают.
      # continue-on-error: гейт информационный — проблемы раннера (GPU/VM)
      # не должны блокировать раздачу артефактов; падение видно в логе.
      - name: Smoke — запуск на macOS-раннере (20 с)
        if: runner.os == 'MacOS'
        continue-on-error: true
        shell: bash
        run: |
          BIN=target/aarch64-apple-darwin/release/canvasdesk
          "$BIN" --stress 500 > smoke.log 2>&1 &
          PID=$!
          sleep 20
          if kill -0 "$PID" 2>/dev/null; then
            echo "smoke OK: процесс жив через 20 с (pid $PID) — старт/инициализация GPU/цикл событий прошли"
            kill "$PID" 2>/dev/null || true
            sleep 2
            kill -9 "$PID" 2>/dev/null || true
            echo "--- smoke.log (первые 30 строк) ---"
            head -30 smoke.log || true
          else
            echo "::error::CanvasDesk упал при старте на macOS — лог ниже"
            tail -80 smoke.log || true
            exit 1
          fi

      # ---- macOS: универсальный бандл ----------------------------------
      - name: Package universal2 .app (macOS)
        if: runner.os == 'MacOS'
        shell: bash
        run: |
          chmod +x scripts/package-macos.sh
          scripts/package-macos.sh
          tar -czf dist/CanvasDesk-macos-universal.tar.gz -C dist CanvasDesk.app LAUNCH-macOS.txt
          ls -la dist/

      # ---- путь артефакта ----------------------------------------------
      - name: Resolve binary path (Unix)
        if: runner.os == 'Linux'
        shell: bash
        run: echo "BIN_PATH=target/release/canvasdesk" >> "$GITHUB_ENV"
      - name: Resolve binary path (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "BIN_PATH=target/release/canvasdesk.exe" >> "$GITHUB_ENV"

      - name: Upload artifact (Linux/Windows)
        if: runner.os != 'MacOS'
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: ${{ env.BIN_PATH }}
          if-no-files-found: error # ошибка не скроется молча
          retention-days: 14 # чтобы артефакты не копились бесконечно

      # tar.gz сохраняет exec-биты и ad-hoc подпись (zip от upload-artifact —
      # нет); рядом сырой universal-бинарь для запуска из терминала.
      - name: Upload artifact (macOS universal)
        if: runner.os == 'MacOS'
        uses: actions/upload-artifact@v4
        with:
          name: build-macos-universal
          path: |
            dist/CanvasDesk-macos-universal.tar.gz
            dist/canvasdesk
          if-no-files-found: error
          retention-days: 14

  # FR-LLM-PROXY / PRD-0010 F-5.10: stateless cloud-proxy для wasm-пути
  # OAuth/BYOK — юнит-тесты воркера (node --test, без wrangler и сети).
  llm-proxy:
    name: llm-proxy (worker tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: test
        working-directory: cloud/llm-proxy
        run: npm test
