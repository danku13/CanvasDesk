name: Pages domain diagnostics

# deps-W5 (#75), подсессия 7: прежний «Pages domain revalidation» (Remove→Re-add
# через GITHUB_TOKEN) мёртв — GitHub блокирует управление Pages-сайтом для всех
# интеграционных токенов: fine-grained PAT → 403 «by personal access token»,
# GITHUB_TOKEN в ране (даже с выданным Pages:write) → 403 «by integration»,
# что доказано логами ранов 38633787625 / 38635481070 / 38635845225 /
# 38655469782 / 38667813240 / 38694885350. Cron удалён, чтобы не плодить
# падающие раны каждые 20 минут. Файл оставлен как чистая диагностика
# DNS/HTTPS с инфраструктуры GitHub Actions (Azure US) — вантаж, близкий к
# DNS-чекерам самого GitHub. Запуск: правка этого файла (push на main)
# или кнопка Run workflow.

on:
  push:
    branches: [main]
    paths: [".github/workflows/domain-revalidate.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    name: DNS/HTTPS probe (runner vantage)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe app.canvasdesk.tech
        run: |
          set -x
          echo "=== resolv.conf ==="
          cat /etc/resolv.conf
          echo "=== default resolver ==="
          dig +noall +answer app.canvasdesk.tech CNAME
          dig +noall +answer app.canvasdesk.tech A
          echo "=== authoritative ns1/ns2.reg.ru ==="
          dig +noall +answer @ns1.reg.ru app.canvasdesk.tech CNAME
          dig +noall +answer @ns2.reg.ru app.canvasdesk.tech CNAME
          echo "=== apex ==="
          dig +noall +answer canvasdesk.tech A
          echo "=== HTTP / HTTPS ==="
          curl -sS -m 15 -o /dev/null -w 'http  %{http_code}\n' http://app.canvasdesk.tech/app/ || true
          curl -sS -m 15 -o /dev/null -w 'https %{http_code}\n' https://app.canvasdesk.tech/app/ || true
          echo | openssl s_client -servername app.canvasdesk.tech -connect app.canvasdesk.tech:443 2>/dev/null | openssl x509 -noout -subject -issuer 2>/dev/null || echo "TLS: no cert"
