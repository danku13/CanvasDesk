name: Pages domain diagnostics

# deps-W5 (#75), подсессия 12: диагностика верификации домена canvasdesk.tech.
# Прежние факты: управление Pages-сайтом через API недоступно интеграционным
# токенам (PAT/GITHUB_TOKEN → 403), поэтому файл — только read-only пробы.
# Задача прогона: показать, что видит инфраструктура GitHub/Azure при запросе
# TXT-записи верификации _github-pages-challenge-danku13.canvasdesk.tech
# (в DNS у ns1/ns2.reg.ru сейчас значение 68e2902377d8fe3611559d8d7d916b,
# TTL 86400; раньше было 3ba5cba28fae69bb1090079ab25b51 — значение менялось).
# Триггер: push этого файла на main или кнопка Run workflow.

on:
  push:
    branches: [main]
    paths: [".github/workflows/domain-revalidate.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    name: DNS/HTTPS probe (runner vantage)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe verification TXT and Pages hosts
        run: |
          set -x
          echo "=== TXT verification record ==="
          dig +noall +answer TXT _github-pages-challenge-danku13.canvasdesk.tech
          dig +noall +answer TXT _github-pages-challenge-danku13.canvasdesk.tech @9.9.9.9
          dig +noall +answer TXT _github-pages-challenge-danku13.canvasdesk.tech @8.8.8.8
          dig +noall +answer TXT _github-pages-challenge-danku13.canvasdesk.tech @1.1.1.1
          echo "=== authoritative ==="
          dig +noall +answer TXT _github-pages-challenge-danku13.canvasdesk.tech @ns1.reg.ru
          dig +noall +answer TXT _github-pages-challenge-danku13.canvasdesk.tech @ns2.reg.ru
          echo "=== app / apex ==="
          dig +noall +answer app.canvasdesk.tech CNAME
          dig +noall +answer canvasdesk.tech A
          echo "=== HTTPS ==="
          curl -sS -m 15 -o /dev/null -w 'https %{http_code}\n' https://app.canvasdesk.tech/app/ || true
          echo | openssl s_client -servername app.canvasdesk.tech -connect app.canvasdesk.tech:443 2>/dev/null | openssl x509 -noout -subject 2>/dev/null || echo "TLS: no cert"
