# cargo-deny configuration — CP0 волны 0 продуктового роадмапа
# (docs/plans/product-roadmap.md §4.1, шаг 0.1; ADR-0008;
#  docs/architecture/math-computing-stack.md §7.2 — allowlist).
#
# Правило: prod- и dev-зависимости допускаются только с пермиссивными
# лицензиями из allowlist архдока §7.2. Copyleft (GPL/AGPL/LGPL/MPL/
# EPL/CDDL/EUPL) и restrictive («non-commercial»/«educational», CC-BY-NC)
# — запрет на любом уровне дерева: дерево всё равно попадает в SBOM и
# предъявляется экспертизе (реестр РФ).
#
# Пояснение к «Apache-2.0 WITH LLVM-exception»: LLVM-exception только
# ОСЛАБЛЯЕТ Apache-2.0 (разрешает встраивание без сохранения нотайсов в
# объектном коде) — строго более пермиссивная лицензия; допущена явной
# строкой allow с этим комментарием как фиксацией выбора.

[graph]
# Считаем всё дерево включая dev-dependencies и тесты: SBOM для реестра
# включает dev-зависимости бинаря (§7.2 denylist тот же для dev).
all-features = false
no-default-features = false

[licenses]
version = 2

# Allowlist §7.2 архдока + OR-комбинации допустимы автоматически
# (SPDX-выражение проходит, если разрешена каждая OR-ветвь).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception", # строго пермиссивнее Apache-2.0, см. шапку
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "0BSD",
]

# Дублирующие лицензии (dual MIT/Apache) не требуют текста каждой:
# проверяем что хотя бы одна разрешённая присутствует — это и делает
# SPDX-оценка по умолчанию (expression evaluating to allowed).
confidence-threshold = 0.93

# Workspace-крейты CanvasDesk — собственный код, не распространяемый как
# отдельный crates.io-пакет (закрытый B2B-продукт); в SBOM попадают как
# first-party компоненты.
private = { ignore = true }

# Denylist §7.2: всё, что не в allow, — deny (настройка по умолчанию
# для не перечисленных лицензий). Явные denies не задействованы:
# отсутствие в allow уже отклоняет выражение целиком.

# Точечные clarify (если cargo-deny сообщит о неоднозначном SPDX
# конкретного крейта) добавляются сюда как [[licenses.clarify]] с полями
# crate/expr, предварённые обоснованием в docs/DEPENDENCIES.md.

[bans]
# Несколько версий одного крейта — предупреждение (не гейт): wgpu-дерево
# тянет дубли сознательно, чистка — отдельная задача оптимизации.
multiple-versions = "warn"
# `*`-версии запрещены: воспроизводимость сборки (Cargo.lock --locked).
wildcards = "deny"
# Явное перечисление отбракованных крейтов (архдок §4.3):
# C/C++-нативлиб, криптоядра и т.п. сюда же по мере появления.
deny = [
    # { name = "ring" },       # пример: криптоядро (политика §7.5) —
    # раскомментировать при появлении в дереве, вместе с ADR.
]
# Пустой allow: реестр зависимостей ведётся в docs/DEPENDENCIES.md,
# контроль состава — ревью PR + реестр, а не жёсткий allowlist имён.

[sources]
# Только crates.io + собственные path-крейты: гит- и URL-зависимости
# ломают лицензионный аудит и воспроизводимость (реестр РФ).
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[advisories]
# База RUSTSEC: уязвимости — deny (дефолт), unmaintained-уведомления —
# точечно игнорируются по ID с обоснованием (ниже) и учётом долга в
# docs/DEPENDENCIES.md §Долг сопровождения; новые unmaintained валят CI
# и требуют сознательного триажа (добавить в ignore или обновить крейт).
version = 2
yanked = "deny"
ignore = [
    # RUSTSEC-2024-0436: paste 1.0.15 не сопровождается. Глубокая
    # транзитивная зависимость wgpu 22 (через naga). Замена: миграция
    # wgpu 23+ — вне волны 0 (роадмап §4.5: рендер-стек стабилен до
    # гейта Go, обновление тянется с риском регрессий рендера).
    "RUSTSEC-2024-0436",
    # RUSTSEC-2026-0206: rustybuzz 0.14.1 не сопровождается. Тянет
    # cosmic-text 0.12 → glyphon 0.6 (шейпинг текста). Решение —
    # миграция cosmic-text/glyphon мажорных версий; отложено тем же
    # решением (рендер-стек).
    "RUSTSEC-2026-0206",
    # RUSTSEC-2026-0192: ttf-parser (0.20/0.21/0.25) не сопровождается.
    # Три копии через cosmic-text/glyphon/rustybuzz. Убирается миграцией
    # рендер-стека; дубль-версии — предупреждение в [bans].
    "RUSTSEC-2026-0192",
]
