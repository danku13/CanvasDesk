[package]
name = "canvas-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
canvas-core.workspace = true
tracing.workspace = true
# тамбнейл-кэш SQLite (SPEC §5.2)
rusqlite.workspace = true
# файловый вотчер (T10, SPEC §7.5): кроссплатформенный (inotify/RDCW),
# чтобы интеграционные тесты гонялись и на Linux CI/dev
notify.workspace = true

# Windows-only: тамбнейлы, preview handlers, drag-drop, WorkerW (SPEC §4)
[target.'cfg(windows)'.dependencies]
windows.workspace = true
# прямой путь ::windows_core в коде, сгенерированном #[implement] (T9)
windows-core.workspace = true
# ошибки AttachError/HierarchyError модуля desktop (T15; cfg(windows)-код —
# на Linux не компилируется, поэтому вне общей секции)
thiserror.workspace = true
