[package]
publish = false # внутренний крейт закрытого продукта; не публикуется на crates.io (CP0, ADR-0008)
name = "canvas-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# FR-051 U1: чистая геометрия экрана без GPU/ОС (PRD-0009 §7.3/§9.1:
# headless-тестируемо, G7).
# FR-053 U3 (F-6): TextMeasurer шейпит реальным cosmic-text — шрифт уже в
# workspace (canvas-render), НЕ новая runtime-зависимость (G7); без wgpu —
# headless-тестируемо сохраняется.
cosmic-text.workspace = true
# FR-055 U4 (F-8, план FR-051 «canvas-core подключается на U3 с токенами»):
# кит-стили — только spacing/radius-scale токенов canvas-core (внутренняя
# зависимость, 0 новых внешних — G7; цикла нет: canvas-core самодостаточен).
canvas-core.workspace = true
[features]
# FR-068 W2: default — flex-engine (встроенный, 0 deps; §Контракт-2:
# default сборка — 0 внешних UI-runtime-deps). `mock-shaper` — off.
# FR-068 W4: фича `taffy` вырезана вместе с TaffyBackend — движок один.
default = ["flex-engine"]
# FR-068 W2: маркер-фича собственного движка `FlexLayoutEngine`
# (layout/flex.rs). ПУСТАЯ ([]) и в default: движок встроен в крейт
# (0 deps — zero-dep инвариант G7 не зависит от флага), фича — семантический
# маркер выбора движка для потребителей/CI (`--features flex-engine`).
flex-engine = []
# FR-068 W2: `MockShaper` (shaper.rs) — детерминированный шейпер для
# тестов (не для продакшна). Добавляет реализацию, НЕ меняет default:
# `TextMeasurer::new()` всегда CosmicShaper (реальный шейпинг = метрики
# рендера, CR-015); мок — только через `TextMeasurer::with_shaper`.
mock-shaper = []
