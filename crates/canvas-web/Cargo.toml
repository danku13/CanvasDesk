[package]
publish = false # внутренний крейт закрытого продукта; не публикуется на crates.io (CP0, ADR-0008)
name = "canvas-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# каркас W4 (wasm-port §6): console-логирование на tracing — свой слой,
# ноль новых внешних зависимостей (кроме bindgen-семейства, см. ниже)
tracing.workspace = true
tracing-subscriber.workspace = true
# bindgen-обвязка (§2/§3.5): генерация JS-глю для браузерной сборки;
# на нативных целях макросы раскрываются в заглушки (контрольная сборка
# 2026-09-16) — крейт собирается в составе workspace
wasm-bindgen.workspace = true

# Прошивка W4 (wasm-port §6.1, трек B): App/AppEvent из lib-части canvas-app
# (bin остаётся нативной обёрткой — DAG: canvas-web лист, §3.5); модель,
# поиск и storage — за нейтральными трейтами canvas-core; сцена —
# canvas-scene; типы событий виджетов — canvas-widgets; Renderer и
# контракт async-инициализации (renderer_init) — canvas-render; окно и
# spawn_app — winit web
canvas-app.workspace = true
canvas-core.workspace = true
canvas-render.workspace = true
canvas-scene.workspace = true
canvas-widgets.workspace = true
winit.workspace = true
anyhow.workspace = true
# Прошивка (§3.4): футура async-инициализации Renderer — spawn_local
wasm-bindgen-futures.workspace = true
# W6: JsFuture (промисы OPFS/FS Access/IDB), Function.apply (JS-глю recent)
js-sys.workspace = true
# W6: конфиг web — localStorage хранит TOML-текст (тот же формат config.toml)
toml.workspace = true
# W11: widget_state — одна JSON-запись в localStorage (карта StateMap)
serde_json.workspace = true
# Прошивка: вставка winit-канваса в DOM (renderer_launch) + доступ
# к document/window (web_sys::Window/Document/Node/HtmlCanvasElement)
# W5: Clipboard/Navigator — navigator.clipboard за трейтом (web_clipboard);
#     Location — чтение location.search для URL-параметров (?stress=N)
web-sys = { workspace = true, features = [
    "HtmlCanvasElement",
    "Document",
    "Window",
    "Element",
    "Node",
    "Clipboard",
    "Navigator",
    "Location",
    # W6 (§4): OPFS-хранилище канвасов + FS Access (пикер/хэндлы) +
    # DOM-drop + экспорт blob + конфиг из localStorage
    "StorageManager",
    "Storage",
    "FileSystemDirectoryHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemFileHandle",
    "FileSystemHandle",
    "FileSystemWritableFileStream",
    "FileSystemHandlePermissionDescriptor",
    "FileSystemPermissionMode",
    "WritableStream",
    "OpenFilePickerOptions",
    "FilePickerAcceptType",
    "File",
    "FileList",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "HtmlAnchorElement",
    "HtmlButtonElement",
    "HtmlElement",
    "Event",
    "EventTarget",
    "DragEvent",
    "DataTransfer",
    "DataTransferItemList",
    "DataTransferItem",
    # W10 (§6): превью картинок — createImageBitmap → OffscreenCanvas
    # downscale → RGBA (существующий thumbs-атлас render)
    "ImageBitmap",
    "ImageData",
    "OffscreenCanvas",
    "OffscreenCanvasRenderingContext2d",
] }

[dev-dependencies]
# нативные тесты зеркала: json! для extra-полей канваса
serde_json.workspace = true

[lib]
name = "canvas_web"
# §3.1 wasm-port: web-платформенный слой — зеркало canvas-shell по роли;
# cdylib — браузерный бинарь (trunk), rlib — нативные тесты каркаса
crate-type = ["cdylib", "rlib"]
