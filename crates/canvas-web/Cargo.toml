[package]
publish = false # внутренний крейт закрытого продукта; не публикуется на crates.io (CP0, ADR-0008)
name = "canvas-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# каркас W4 (wasm-port §6): console-логирование на tracing — свой слой,
# ноль новых внешних зависимостей (кроме bindgen-семейства, см. ниже)
tracing.workspace = true
tracing-subscriber.workspace = true
# bindgen-обвязка (§2/§3.5): генерация JS-глю для браузерной сборки;
# на нативных целях макросы раскрываются в заглушки (контрольная сборка
# 2026-09-16) — крейт собирается в составе workspace
wasm-bindgen.workspace = true

# Прошивка W4 (wasm-port §6.1, трек B): App/AppEvent из lib-части canvas-app
# (bin остаётся нативной обёрткой — DAG: canvas-web лист, §3.5); модель,
# поиск и storage — за нейтральными трейтами canvas-core; сцена —
# canvas-scene; типы событий виджетов — canvas-widgets; Renderer и
# контракт async-инициализации (renderer_init) — canvas-render; окно и
# spawn_app — winit web
canvas-app.workspace = true
canvas-core.workspace = true
canvas-render.workspace = true
canvas-scene.workspace = true
canvas-widgets.workspace = true
# W3 (волна LLM, F-5.10): прямой доступ к транспорту/токен-стору
# (`canvas_llm::WasmFetchTransport`, `TokenStore`, `chatgpt_oauth`).
# canvas-app уже тянет canvas-llm за l1-llm, но мост canvas-web строит
# провайдер-независимые швы (transport/spawner/store) — ссылка явная.
canvas-llm.workspace = true
winit.workspace = true
anyhow.workspace = true
# Прошивка (§3.4): футура async-инициализации Renderer — spawn_local
wasm-bindgen-futures.workspace = true
# W6: JsFuture (промисы OPFS/FS Access/IDB), Function.apply (JS-глю recent)
js-sys.workspace = true
# W6: конфиг web — localStorage хранит TOML-текст (тот же формат config.toml)
toml.workspace = true
# W11: widget_state — одна JSON-запись в localStorage (карта StateMap)
serde_json.workspace = true
# W3 (llm_web): StoredSession (PKCE-сессия логина) — derive Deserialize;
# serde в workspace с derive (см. корневой Cargo.toml)
serde.workspace = true
# Прошивка: вставка winit-канваса в DOM (renderer_launch) + доступ
# к document/window (web_sys::Window/Document/Node/HtmlCanvasElement)
# W5: Clipboard/Navigator — navigator.clipboard за трейтом (web_clipboard);
#     Location — чтение location.search для URL-параметров (?stress=N)
web-sys = { workspace = true, features = [
    "HtmlCanvasElement",
    "Document",
    "Window",
    "Element",
    # UR-003: classList body (cd-panel-left/right — сдвиг DOM-хрома)
    "DomTokenList",
    "Node",
    "Clipboard",
    "Navigator",
    "Location",
    # W6 (§4): OPFS-хранилище канвасов + FS Access (пикер/хэндлы) +
    # DOM-drop + экспорт blob + конфиг из localStorage
    "StorageManager",
    "Storage",
    "FileSystemDirectoryHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemFileHandle",
    "FileSystemHandle",
    # FR-105 (мультиканвас C2): kind() листинга OPFS (files vs directories)
    "FileSystemHandleKind",
    "FileSystemWritableFileStream",
    "FileSystemHandlePermissionDescriptor",
    "FileSystemPermissionMode",
    "WritableStream",
    "OpenFilePickerOptions",
    "FilePickerAcceptType",
    "File",
    "FileList",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "HtmlAnchorElement",
    "HtmlButtonElement",
    "HtmlElement",
    # FR-095/097 (мобильный web): input-шим клавиатуры, visualViewport
    # (перекрытие клавиатурой), matchMedia pointer:coarse (тач-цели)
    "HtmlInputElement",
    "KeyboardEvent",
    "KeyboardEventInit",
    "InputEvent",
    "MediaQueryList",
    "VisualViewport",
    "Event",
    "EventTarget",
    # FR-105 (мультиканвас C2): watch внешних изменений — visibility_state
    # (poll lastModified на visibilitychange, №45b/№53b)
    "VisibilityState",
    "DragEvent",
    "DataTransfer",
    "DataTransferItemList",
    "DataTransferItem",
    # W10 (§6): превью картинок — createImageBitmap → OffscreenCanvas
    # downscale → RGBA (существующий thumbs-атлас render)
    "ImageBitmap",
    "ImageData",
    "OffscreenCanvas",
    "OffscreenCanvasRenderingContext2d",
    # W3 (llm_web): history.replaceState (чистка oauth-параметров после
    # callback) + UrlSearchParams (парс/удаление query)
    "History",
    "UrlSearchParams",
] }

[dev-dependencies]
# нативные тесты зеркала: json! для extra-полей канваса
serde_json.workspace = true

[lib]
name = "canvas_web"
# §3.1 wasm-port: web-платформенный слой — зеркало canvas-shell по роли;
# cdylib — браузерный бинарь (trunk), rlib — нативные тесты каркаса
crate-type = ["cdylib", "rlib"]

[features]

# W3 (волна LLM, план llm-waves-w1-w2-w3 §4 п.3 — «feature-флип»): активация
# ИИ-функционала в web-сборке. Фичи включаются ТОЛЬКО на wasm32-цели:
# - canvas-app/l1-llm — LLM-executor, панели, health/discovery UI, suggest
#   mm-источник (W2-симы наполняются здесь, app_spawn.rs);
# - canvas-llm/l1-llm — типы провайдеров (serde-деривы, OAuth-клиент);
# - canvas-llm/wasm-fetch — браузерный fetch-транспорт (F-5.10). Легален
#   только под wasm32 (compile_error! на нативе, ADR-0011) — поэтому в
#   target-блоке, а не в общем [dependencies].
# Нативная сборка canvas-web (rlib-тесты каркаса) остаётся без сети —
# гейт ADR-0011 для нативных целей не нарушается. Правка ADR-0011
# (amendment: сеть в wasm за явной feature, транспорт — fetch к
# cloud/llm-proxy) — docs/adr/adr-0011-wasm-build-gate.md.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# wasm-fetch-bridge: canvas-app строит провайдеров на браузерном fetch
# (llm_factory::platform_transport) — ureq на wasm32 паникует в рантайме.
canvas-app = { workspace = true, features = ["wasm-fetch-bridge"] }
canvas-llm = { workspace = true, features = ["l1-llm", "wasm-fetch"] }
