# trunk — сборка браузерного бинаря canvas-web (wasm-port §3.5, W4-каркас).
#
# Использование (из crates/canvas-web):
#   trunk build        # артефакты → target/dist (каталог target gitignored)
#   trunk serve        # дев-сервер (приёмка прошивки W4: страница грузится)
#
# Инструменты зафиксированы (воспроизводимость): trunk 0.21.14,
# wasm-bindgen-cli 0.2.127 — версия CLI обязана совпадать с версией
# крейта wasm-bindgen в Cargo.lock.

[build]
target = "index.html"
dist = "../../target/dist"

# FR-028 v2 (inline-tour bundle): ранее использовался `[[hooks]] stage="build"`
# для копирования `sdk/web-onboarding/canvasdesk-tour.js` в dist — Trunk
# по умолчанию не копирует plain `<script src>` файлы. Хук оказался
# ненадёжным (env var path / timing / platform). Решено: bundle теперь
# inline внутри `index.html` как `<script data-cd-tour-bundle="inline">`
# блок — Trunk обрабатывает index.html и сам инлайнит содержимое в dist
# index.html. Копирование не требуется. См. `scripts/inline_tour_bundle.py`
# (регенерация inline-блока из sdk/web-onboarding/canvasdesk-tour.js при
# пересборке bundle из TS-источника).

[serve]
# приёмка прошивки W4: `trunk serve` → http://127.0.0.1:8080
port = 8080
