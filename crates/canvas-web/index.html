<!doctype html>
<!-- CanvasDesk web (M8, wasm-port §3.5). Прошивка W4: trunk подключает
     JS-глю canvas_web — #[wasm_bindgen(start)] поднимает App; winit web
     создаёт <canvas> при create_window, а canvas-web вставляет его в DOM
     (winit 0.30 не делает этого сам), Renderer инициализируется
     асинхронно (spawn_local, §3.4). -->
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CanvasDesk — web</title>
    <script>
      /* M8/W4 web-compat шим (wasm-port §7, «WebGPU-драйверные баги
         Chromium» — конкретный случай дрейфа спеки). wgpu 22 просит у
         requestDevice лимит maxInterStageShaderComponents, удалённый из
         WebGPU (переименован в maxInterStageShaderVariables): свежие
         Chromium отклоняют весь запрос из-за нераспознанного имени
         («The limit … is not recognized») — падение замаскировано под
         «GPU-адаптер не найден». Шим удаляет из requiredLimits имена,
         которых нет в limits адаптера (generic-фильтр: переживает и
         будущие переименования); значения распознанных лимитов не
         трогает — запрос лимита выше возможностей адаптера честно
         отклоняется браузером, как в спеке. Правило §3.1: web-костыли
         живут в web-слое (canvas-web), ядро и wgpu не патчатся. */
      (function () {
        if (typeof GPUAdapter === "undefined") return;
        var proto = GPUAdapter.prototype;
        if (!proto || !proto.requestDevice) return;
        var orig = proto.requestDevice;
        proto.requestDevice = function (desc) {
          if (
            desc &&
            desc.requiredLimits &&
            this.limits &&
            typeof this.limits === "object"
          ) {
            // for..in, а не Object.keys: свойства GPUAdapterLimits —
            // геттеры на прототипе (собственных enumerable-ключей нет)
            var known = {};
            for (var limit in this.limits) known[limit] = true;
            var filtered = {};
            var dropped = [];
            for (var key in desc.requiredLimits) {
              if (known[key]) {
                filtered[key] = desc.requiredLimits[key];
              } else {
                dropped.push(key);
              }
            }
            if (dropped.length > 0) {
              console.warn(
                "[canvas-web compat] лимиты не распознаны браузером, исключены из requestDevice: " +
                  dropped.join(", "),
              );
              desc = Object.assign({}, desc, { requiredLimits: filtered });
            }
          }
          return orig.call(this, desc);
        };
      })();
    </script>
    <script>
      /* M8/W9 шим (wasm-port §7, «WebGPU-драйверные баги Chromium» —
         горячая клавиша против браузерного ускорителя). Ctrl+P —
         продуктовая связка палитры шаблонов (FR-018), но Chromium по
         Ctrl+P открывает диалог печати: winit-web не делает
         preventDefault для браузерных акселераторов, и печать
         поверхностно перехватывает ввод (пауза rAF-насоса winit) —
         палитра «открывается и умирает». Шим в фазе перехвата (до
         listeners winit на канвасе) гасит ТОЛЬКО default-действие
         браузера; событие продолжает распространяться и доходит до
         App (preventDefault не мешает propagation). Кириллица — «з»
         (русская раскладка, ср. on_key в canvas-app). F5/Ctrl+S/F12 не
         трогаем: перезагрузка — часть UX хранения (W6), остальное вне
         продуктовых связок. Правило §3.1: web-костыли — в canvas-web. */
      (function () {
        document.addEventListener(
          "keydown",
          function (e) {
            if (
              (e.ctrlKey || e.metaKey) &&
              !e.shiftKey &&
              !e.altKey &&
              (e.key === "p" || e.key === "P" || e.key === "з" || e.key === "З")
            ) {
              e.preventDefault();
            }
          },
          true,
        );
      })();
    </script>
    <style>
      /* Канвас winit (вставляется canvas-web'ом из renderer_launch) —
      * единственный контент, растянут на окно; тёмный фон в тон продукта
      * (SPEC §6, темы CR-007) — до первого кадра async-init Renderer.
      * CR-014: dvh — динамический viewport мобильных браузеров (адресная
      * строка): 100vh выше видимой области, низ канваса уходил под бар;
      * dvh ставится ПОСЛЕ vh — старые браузеры берут vh, новые — dvh.
      * touch-action — тач-жесты не скроллят/зумят страницу поверх канваса. */
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #14161a;
      }
      body > canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        /* tabindex="0" (winit: клавиатура) — без рамки фокуса */
        outline: none;
        touch-action: none;
      }
      /* M8/W6 (wasm-port §4.2): DOM-панель хранилища — файловые жесты
      * браузера (пикер/экспорт/недавние) требуют window+жест, канвас —
      * GPU-UI, поэтому три кнопки поверх (W12 отполировали стиль,
      * CR-014 — адаптивность). Инвариант панели: НИКОГДА не покидает
      * экран — flex-wrap + max-width переносят кнопки на новые строки,
      * эллипсис режет текст кнопки (полное имя — в title-тултипе). */
      #w6-toolbar {
        position: fixed;
        top: 8px;
        right: 8px;
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 6px;
        z-index: 10;
        /* Край до края экрана минус отступы: шире не бываем никогда */
        max-width: calc(100vw - 16px);
      }
      #w6-toolbar button {
        background: #1d2128;
        color: #d5d9e0;
        border: 1px solid #333a44;
        border-radius: 6px;
        font: 12px/1.4 system-ui, sans-serif;
        padding: 4px 10px;
        cursor: pointer;
        /* min-width: 0 — кнопка сжимается в flex-строке; переполнение
         * текста — эллипсисом, не выездом панели за край экрана */
        min-width: 0;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #w6-toolbar button:hover { background: #262c35; }
      #w6-toolbar button:focus-visible {
        outline: 2px solid #8ab4ff;
        outline-offset: 1px;
      }
      /* Подпись «Недавние: <имя>» — единственная растяжимая кнопка.
       * Детерминированный кап в px (ch/vw зависят от системного шрифта
       * — на fallback-шрифтах headless/лиукса цифры шире и кап плывёт):
       * панель ≤ ~480px — при открытой панели поиска (топ-центр 460px,
       * правый край vw/2+230) тулбар ≥1200px-окна до неё не
       * дотягивается; 40vw — компаньон для узких окон. Полное имя —
       * в title-тултипе. */
      #w6-toolbar #btn-recent { max-width: min(40vw, 240px); }
      /* Узкие окна/планшеты (<1200px): верх занят GPU-панелями — поиск
       * топ-центр (search_ui.rs, 460px, правый край vw/2+230 — при
       * верстке-как-сейчас тулбар топ-право на 768–1024 наезжает на
       * поле ввода), HUD топ-лево, миникарта — правый нижний угол
       * (220px + отступы), палитра — левый край на всю высоту (футер —
       * подсказка, свернутый стрип — по центру левого края). Тулбар
       * уходит в ЛЕВЫЙ НИЖНИЙ угол — единственную всегда-пустую зону;
       * кап 100vw−264px не даёт залезать в колонку миникарты (floor
       * 180px — на 320-375px кнопки стопкой с эллипсисом). */
      @media (max-width: 1199px) {
        #w6-toolbar {
          top: auto;
          bottom: 8px;
          left: 8px;
          right: auto;
          justify-content: flex-start;
          max-width: max(120px, calc(100vw - 264px));
        }
      }
      /* Тач-экраны: минимальная высота цели ~44px (Apple HIG/Material);
       * у 12px-кнопки с padding 4px было ~27px — мимо пальца. */
      @media (pointer: coarse) {
        #w6-toolbar button {
          font: 13px/1.4 system-ui, sans-serif;
          padding: 12px 16px;
        }
      }
    </style>
    <!-- M8/W6: JS-глю web-оболочки — IndexedDB (недавние + хэндлы FS
         Access) компактнее в JS; Rust-мост — canvas_web::js_glue (вызовы
         Promise → JsFuture). Бойлерплейт open/upgrade транзакций спрятан
         здесь; ошибки — в консоль (оракул дыма), промисы не роняют Rust. -->
    <script>
      window.__canvasdesk = (function () {
        function openDb() {
          return new Promise((resolve, reject) => {
            const req = indexedDB.open("canvasdesk", 1);
            req.onupgradeneeded = () => {
              const db = req.result;
              if (!db.objectStoreNames.contains("recent"))
                db.createObjectStore("recent", { keyPath: "name" });
              if (!db.objectStoreNames.contains("handles"))
                db.createObjectStore("handles");
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
          });
        }
        async function tx(store, mode, fn) {
          const db = await openDb();
          return new Promise((resolve, reject) => {
            const t = db.transaction(store, mode);
            const req = fn(t.objectStore(store));
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
            t.oncomplete = () => db.close();
          });
        }
        return {
          recentPut: (name) =>
            tx("recent", "readwrite", (s) => s.put({ name: name, ts: Date.now() })),
          recentList: () => tx("recent", "readonly", (s) => s.getAll()),
          handlePut: (name, handle) =>
            tx("handles", "readwrite", (s) => s.put(handle, name)),
          handleGet: (name) => tx("handles", "readonly", (s) => s.get(name)),
        };
      })();
    </script>
  </head>
  <body>
    <!-- M8/W6: панель хранилища — листенеры вешает canvas_web::toolbar;
         подпись «Недавние» обновляется из Rust (set_recent_label). -->
    <div id="w6-toolbar">
      <button id="btn-open" title="Открыть .canvas с диска (автосейв в файл)">
        Открыть с диска…
      </button>
      <button id="btn-recent" title="Переоткрыть последний канвас">
        Недавние
      </button>
      <button id="btn-export" title="Скачать последнюю сохранённую версию (.canvas)">
        Экспорт .canvas
      </button>
    </div>
  </body>
</html>
