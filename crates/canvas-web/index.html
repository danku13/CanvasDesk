<!doctype html>
<!-- CanvasDesk web (M8, wasm-port §3.5). Прошивка W4: trunk подключает
     JS-глю canvas_web — #[wasm_bindgen(start)] поднимает App; winit web
     создаёт <canvas> при create_window, а canvas-web вставляет его в DOM
     (winit 0.30 не делает этого сам), Renderer инициализируется
     асинхронно (spawn_local, §3.4). -->
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- FR-107 (C4, №28a): статический дефолт заголовка — «CanvasDesk»;
         после открытия канваса Rust синкает document.title = «Имя — CanvasDesk»
         (title_sync, тот же хук, что ?canvas=). -->
    <title>CanvasDesk</title>
    <!-- FR-028 v2 + FR-087 v2 (единый пикер первого запуска): первый экран —
         ОДНА страница с выбором языка и опциональной рабочей роли (class).
         Запускается СИНХРОННО до всех остальных скриптов (включая WASM
         init Trunk'а в конце body). Если localStorage уже содержит
         canvasdesk.config (с полем language) — пикер не показывается,
         приложение грузится на выбранном языке. Если нет — пикер
         блокирует экран overlay'ем. Язык — переключатель: активная
         кнопка залита основным акцентом (#D68A32), тексты роли живо
         перерисовываются. Клик по карточке роли (или «Продолжить без
         роли») записывает минимальный TOML `language = "ru"`
         (+ `role = "architect"`) в localStorage и перезагружает страницу
         (так canvas-app::load_settings гарантированно подхватит оба поля
         до WASM init). -->
    <style>
      #lang-picker-overlay {
        position: fixed; inset: 0; z-index: 100000;
        background: var(--cd-bg);
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 16px;
        color: var(--cd-text);
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 16px; overflow-y: auto;
        /* Акценты владельца (FR-087 v2): основной — активная кнопка языка,
           вторичный — hover карточек ролей и вторичная кнопка. */
        /* W-f: локальные алиасы → центральные слоты :root (значения
           прежние — резолв через var()). */
        --accent: var(--cd-accent);
        --accent-2: var(--cd-accent-2);
      }
      #lang-picker-overlay[hidden] { display: none; }
      #lang-picker-overlay h1 {
        font-size: 22px; color: var(--cd-text-title); font-weight: 600; margin: 0;
      }
      #lang-picker-overlay p { color: var(--cd-text-muted); margin: 0; }
      #lang-picker-overlay .buttons { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
      /* Единая страница (FR-087 v2): язык + роль на одном экране —
         скрытых шагов нет. */
      #lang-picker-overlay .step { display: flex; flex-direction: column; gap: 12px; align-items: center; max-width: min(640px, 92vw); }
      /* ГВАРД РЕГРЕССА: авторский display на .step перебивает атрибут
         hidden (UA-правило [hidden] слабее любого авторского display) —
         баг FR-087 v1: оба шага рисовались одновременно, пользователь
         видел «две страницы входа» с пустой кнопкой пропуска. Явное
         правило гасит .step, если hidden когда-нибудь вернут. */
      #lang-picker-overlay .step[hidden] { display: none; }
      #lang-picker-overlay button {
        background: var(--cd-surface); color: var(--cd-text-title);
        border: 1px solid var(--cd-border); border-radius: 8px;
        font: 600 16px/1.4 system-ui, sans-serif;
        padding: 12px 24px; cursor: pointer; min-width: 140px;
        /* W-e (дефект №14 аудита ui-kit): тач-цель ≥44×44 CSS px (WCAG 2.5.5
         * / Apple HIG). border-box + min-height гарантируют размер и для
         * оверрайдов паддинга ниже (#role-grid button, .secondary) — текст
         * кнопки браузер центрирует по вертикали сам. */
        box-sizing: border-box; min-height: 44px;
        transition: background 150ms ease, border-color 150ms ease, color 150ms ease;
        -webkit-tap-highlight-color: transparent;
      }
      #lang-picker-overlay button:focus-visible {
        outline: 2px solid var(--accent-2); outline-offset: 2px;
      }
      /* Язык — переключатель: hover невыбранной кнопки — основной акцент;
         АКТИВНАЯ кнопка залита основным акцентом (тёмный текст, контраст ~6:1). */
      #lang-picker-overlay .buttons button[data-lang]:hover {
        background: var(--cd-accent-tint); border-color: var(--accent); color: var(--cd-text-on-tint);
      }
      #lang-picker-overlay .buttons button[data-lang].active {
        background: var(--accent); border-color: var(--accent); color: var(--cd-text-on-accent);
      }
      #lang-picker-overlay .buttons button[data-lang].active:hover {
        background: var(--cd-accent-hover); border-color: var(--cd-accent-hover);
      }
      /* Роли — карточки: hover/focus — вторичный акцент (превью выбора). */
      #lang-picker-overlay #role-grid {
        display: flex; flex-wrap: wrap; justify-content: center;
        gap: 10px; max-width: 560px;
      }
      #lang-picker-overlay #role-grid button {
        min-width: 150px; padding: 10px 16px; font-size: 14px;
      }
      #lang-picker-overlay #role-grid button:hover,
      #lang-picker-overlay #role-grid button:focus-visible {
        background: var(--cd-accent-2-tint); border-color: var(--accent-2); color: var(--cd-text-on-tint);
      }
      #lang-picker-overlay #role-info {
        min-height: 40px; max-width: 520px; text-align: center;
        color: var(--cd-text-muted); font-size: 13px; line-height: 1.5;
        margin: 0;
      }
      /* «Продолжить без роли» — вторичная кнопка: hover вторичным акцентом. */
      #lang-picker-overlay .secondary {
        background: transparent; color: var(--cd-text-muted); border: 1px solid var(--cd-border);
        font-weight: 400; font-size: 13px !important; min-width: 0 !important;
        padding: 8px 14px !important;
      }
      #lang-picker-overlay .secondary:hover {
        background: var(--cd-accent-2-tint-weak); border-color: var(--accent-2); color: var(--cd-text);
      }
      /* FR-089: согласия телеметрии — два предвыбранных чекбокса внизу
         страницы первого запуска. Нативные чекбоксы с accent-color =
         основной акцент (отметка #D68A32); лейблы кликабельны, hover —
         вторичный акцент (как у карточек ролей), focus-within —
         outline вторичного акцента (клавиатурная доступность). */
      #lang-picker-overlay .consent {
        display: flex; flex-direction: column; gap: 6px; align-items: stretch;
        margin-top: 6px; padding: 12px 14px; max-width: 560px;
        border: 1px solid var(--cd-border-soft); border-radius: 10px;
        background: var(--cd-surface-veil);
      }
      #lang-picker-overlay .consent-title {
        color: var(--cd-text-muted); font-size: 12px; font-weight: 600; margin: 0;
        text-transform: uppercase; letter-spacing: 0.4px;
      }
      #lang-picker-overlay .consent label {
        display: flex; align-items: flex-start; gap: 10px;
        cursor: pointer; color: var(--cd-text); font-size: 13px; line-height: 1.45;
        border-radius: 6px; padding: 4px 6px; margin: 0 -6px;
        /* W-e (дефект №14): строка согласия — тач-цель (клик по лейблу
         * переключает чекбокс), поэтому ≥44px по высоте. */
        box-sizing: border-box; min-height: 44px;
        transition: background 150ms ease, color 150ms ease;
        -webkit-tap-highlight-color: transparent;
      }
      #lang-picker-overlay .consent label:hover {
        background: var(--cd-accent-2-tint-weak); color: var(--cd-text-on-tint);
      }
      #lang-picker-overlay .consent label:focus-within {
        outline: 2px solid var(--accent-2); outline-offset: 2px;
      }
      #lang-picker-overlay .consent input[type="checkbox"] {
        accent-color: var(--accent); width: 16px; height: 16px;
        margin: 2px 0 0 0; flex: none; cursor: pointer;
      }
      #lang-picker-overlay .consent .hint {
        color: var(--cd-text-hint); font-size: 11px; line-height: 1.45; margin: 0;
      }
    </style>
    <script>
      /* FR-028 v2 + FR-087 v2 (единый пикер первого запуска): первый экран
       * web-версии — ОДНА страница: выбор языка (переключатель, активная
       * кнопка залита основным акцентом) и опциональная рабочая роль
       * (class) — сетка карточек, hover/focus показывает краткую
       * информацию «какие типы подсказок будут включены». «Продолжить
       * без роли» — class=default (все подсказки, прежнее поведение).
       * Выбор пишет минимальный TOML `language = "ru"`
       * (+ `role = "architect"`) в localStorage и перезагружает страницу —
       * canvas-app::load_settings подхватит оба поля до WASM init. Роль
       * можно сменить позже в настройках (таб «Профиль», dropdown «Роль»).
       * Данные ролей синхронны реестру canvas-core::roles (RU+EN).
       * История: v1 была двухшаговой (язык → роль), но авторский CSS
       * .step{display:flex} перебивал атрибут hidden UA-стилей — оба шага
       * рисовались одновременно («две страницы входа» с пустой кнопкой
       * пропуска); v2 свела всё в один экран без шагов. */
      (function () {
        // Проверяем, есть ли уже canvasdesk.config в localStorage.
        // Если есть — приложение уже было запущено, язык выбран (или
        // пользователь явно сбросил — тогда покажем пикер заново).
        try {
          var ls = window.localStorage;
          if (ls && ls.getItem("canvasdesk.config") !== null) {
            return; // язык уже выбран — пикер не нужен
          }
        } catch (e) {
          // localStorage недоступен (приватный режим) — пикер всё равно
          // покажем, но выбор не сохранится (canvas-app дефолт = Ru).
        }
        // FR-087: реестр ролей (зеркало canvas_core::roles::ROLES;
        // default здесь нет — его выбирает «Продолжить без роли»).
        var ROLES = [
          { id: "architect", name_ru: "Архитектор", name_en: "Architect",
            d_ru: "Подсказки шаблонов: бэкенд и сеть. Схемы: архитектура и планирование мощностей.",
            d_en: "Template hints: backend and network. Schemes: architecture and capacity planning." },
          { id: "developer", name_ru: "Разработчик", name_en: "Developer",
            d_ru: "Подсказки шаблонов: бэкенд и сеть. Схемы: архитектура сервисов.",
            d_en: "Template hints: backend and network. Schemes: service architecture." },
          { id: "product-manager", name_ru: "Продакт-менеджер", name_en: "Product Manager",
            d_ru: "Подсказки шаблонов: продуктовая аналитика и юнит-экономика. Схемы: бизнес-модели и фреймворки.",
            d_en: "Template hints: product analytics and unit economics. Schemes: business models and frameworks." },
          { id: "analyst", name_ru: "Аналитик", name_en: "Analyst",
            d_ru: "Подсказки шаблонов: продуктовая аналитика и юнит-экономика. Схемы: бизнес, фреймворки и планирование.",
            d_en: "Template hints: product analytics and unit economics. Schemes: business, frameworks and planning." },
          { id: "cio", name_ru: "CIO", name_en: "CIO",
            d_ru: "Подсказки шаблонов: бэкенд-инфраструктура и юнит-экономика. Схемы: бизнес, архитектура и планирование.",
            d_en: "Template hints: backend infrastructure and unit economics. Schemes: business, architecture and planning." },
          { id: "cto", name_ru: "CTO", name_en: "CTO",
            d_ru: "Подсказки шаблонов: бэкенд, сеть и юнит-экономика. Схемы: архитектура, бизнес и планирование.",
            d_en: "Template hints: backend, network and unit economics. Schemes: architecture, business and planning." },
          { id: "founder", name_ru: "Основатель / CEO", name_en: "Founder / CEO",
            d_ru: "Подсказки шаблонов: юнит-экономика. Схемы: бизнес-модели, планирование и фреймворки.",
            d_en: "Template hints: unit economics. Schemes: business models, planning and frameworks." }
        ];
        document.addEventListener("DOMContentLoaded", function () {
          var overlay = document.getElementById("lang-picker-overlay");
          if (!overlay) return;
          overlay.hidden = false;
          var roleGrid = document.getElementById("role-grid");
          var roleInfo = document.getElementById("role-info");
          var roleTitle = document.getElementById("role-title");
          var roleSkip = document.getElementById("role-skip");
          var consentTitle = document.getElementById("consent-title");
          var consentCounterLabel = document.getElementById("consent-counter-label");
          var consentAnalyticsLabel = document.getElementById("consent-analytics-label");
          var consentHint = document.getElementById("consent-hint");
          var consentCounter = document.getElementById("consent-counter");
          var consentAnalytics = document.getElementById("consent-analytics");
          var langBtns = overlay.querySelectorAll("button[data-lang]");
          var chosen = "ru"; // дефолт — как у <html lang="ru"> и canvas-app
          var t = {
            ru: {
              title: "Рабочая роль (необязательно)",
              hint: "Роль включает подсказки соответствующих типов шаблонов и схем — наведите на карточку, чтобы увидеть какие. Сменить роль можно позже в настройках, таб «Профиль».",
              skip: "Продолжить без роли (все подсказки)",
              // FR-089: согласия телеметрии (оба чекбокса предвыбраны)
              consentTitle: "Помочь проекту (необязательно)",
              consentCounter: "Анонимный счётчик использования",
              consentAnalytics: "Метрики и отчёты об ошибках",
              consentHint: "Одна отметка в сутки, без личных данных. Метрики помогают находить баги. Отключаются в настройках, таб «Профиль»."
            },
            en: {
              title: "Work role (optional)",
              hint: "A role enables matching template and scheme hints — hover a card to see which. You can change the role later in Settings, the Profile tab.",
              skip: "Continue without a role (all hints)",
              consentTitle: "Help improve CanvasDesk (optional)",
              consentCounter: "Anonymous usage counter",
              consentAnalytics: "Metrics & error reports",
              consentHint: "One note per day, no personal data. Metrics help find bugs. Turn off anytime in Settings, the Profile tab."
            }
          };
          function pick(role) {
            // Записываем минимальный TOML в localStorage — canvas-app
            // через load_settings::toml::from_str подхватит `language = "ru"`
            // и `role = "..."`; остальные поля — serde(default).
            // FR-089: согласия чекбоксов — теми же bool-полями в TOML
            // (тумблеры таба «Профиль» подхватят их после загрузки).
            var toml = 'language = "' + chosen + '"';
            if (role) toml += '\nrole = "' + role + '"';
            var cCounter = consentCounter ? consentCounter.checked : true;
            var cAnalytics = consentAnalytics ? consentAnalytics.checked : true;
            toml += "\ntelemetry_counter = " + (cCounter ? "true" : "false");
            toml += "\ntelemetry_analytics = " + (cAnalytics ? "true" : "false");
            // FR-089: JSON-согласие — рантайм-источник правды JS-модуля
            // телеметрии (скрипт ниже в <head>): флаги + анонимный UUID
            // (генерируем здесь один раз; без crypto — деградация к
            // случайной строке) + отметка суток счётчика.
            var anonId = "";
            try {
              anonId = window.crypto && window.crypto.randomUUID
                ? window.crypto.randomUUID()
                : "cd-" + Date.now().toString(36) + "-" +
                  Math.random().toString(36).slice(2, 10);
            } catch (e) { /* без UUID — счётчик всё равно работает */ }
            try {
              var ls = window.localStorage;
              if (ls) {
                ls.setItem("canvasdesk.config", toml);
                ls.setItem("canvasdesk.consent", JSON.stringify({
                  counter: cCounter,
                  analytics: cAnalytics,
                  anonId: anonId,
                  lastWasmDay: null
                }));
              }
            } catch (e) { /* localStorage недоступен — продолжаем */ }
            // Перезагружаем страницу — WASM init начнётся заново и
            // подхватит новый localStorage.
            window.location.reload();
          }
          function infoDefault() {
            roleInfo.textContent = t[chosen].hint;
          }
          // Одна страница: смена языка перерисовывает тексты живо (без
          // перезагрузки); клик по карточке роли применяет выбор сразу.
          function render() {
            roleTitle.textContent = t[chosen].title;
            roleSkip.textContent = t[chosen].skip;
            // FR-089: тексты согласий — тем же живым переключателем языка
            consentTitle.textContent = t[chosen].consentTitle;
            consentCounterLabel.textContent = t[chosen].consentCounter;
            consentAnalyticsLabel.textContent = t[chosen].consentAnalytics;
            consentHint.textContent = t[chosen].consentHint;
            infoDefault();
            for (var i = 0; i < langBtns.length; i++) {
              var active = langBtns[i].getAttribute("data-lang") === chosen;
              langBtns[i].classList.toggle("active", active);
              langBtns[i].setAttribute("aria-pressed", active ? "true" : "false");
            }
            roleGrid.innerHTML = "";
            for (var j = 0; j < ROLES.length; j++) {
              var role = ROLES[j];
              var btn = document.createElement("button");
              btn.type = "button";
              btn.textContent = chosen === "en" ? role.name_en : role.name_ru;
              (function (r) {
                function describe() {
                  roleInfo.textContent = chosen === "en" ? r.d_en : r.d_ru;
                }
                btn.addEventListener("mouseenter", describe);
                btn.addEventListener("focus", describe);
                btn.addEventListener("mouseleave", infoDefault);
                btn.addEventListener("blur", infoDefault);
                btn.addEventListener("click", function () { pick(r.id); });
              })(role);
              roleGrid.appendChild(btn);
            }
          }
          for (var i = 0; i < langBtns.length; i++) {
            langBtns[i].addEventListener("click", function (e) {
              var lang = e.currentTarget.getAttribute("data-lang");
              if (lang !== chosen) {
                chosen = lang;
                render();
              }
            });
          }
          roleSkip.addEventListener("click", function () { pick(null); });
          render();
        });
      })();
    </script>
    <script>
      /* FR-089: телеметрия web-версии — двухуровневое согласие, PostHog
       * (продуктовые метрики + отчёты об ошибках) и анонимный счётчик
       * уникальных пользователей WASM-сервиса.
       *
       * ═════════ КОНФИГ ВЛАДЕЛЬЦА ═════════
       * Ключ и регион вписаны (EU cloud): POSTHOG_KEY/HOST ниже, проверен
       * запросом /batch/ из сессии сборки (200 Ok). Остался один шаг в
       * самом PostHog: Settings → General → Allowed domains → домен
       * хостинга CanvasDesk (защита публичного ключа от чужих лимитов).
       * Ключ phc_... клиентский — публиковать в открытом репозитории
       * безопасно (как Firebase config); при мусорных событиях —
       * перегенерировать в настройках проекта и заменить здесь.
       * Пустой POSTHOG_KEY = полный no-op: SDK не грузится, счётчик не
       * отправляется, локально читаются только согласия.
       *
       * Согласия (чекбоксы первого запуска, оба предвыбраны; источник
       * правды рантайма — JSON localStorage `canvasdesk.consent`, пикер
       * пишет при первом входе, Rust-персист настроек синхронизирует
       * дальше и эмитит canvasdesk:consent-changed):
       *   counter   — «сколько уникальных пользователей взаимодействует
       *               с WASM-сервисом»: суточная отметка wasm_used,
       *               distinct_id = анонимный UUID; отправка прямой в
       *               PostHog /batch/ БЕЗ SDK — работает даже при
       *               выключенных метриках (двухуровневое согласие).
       *   analytics — PostHog SDK (jsDelivr +esm, динамический import
       *               только при согласии): ошибки окна (window error +
       *               unhandledrejection → $exception; SDK-перехват
       *               capture_exceptions), продуктовые события/autocapture.
       *               Выключение тумблером → opt_out_capturing() на лету.
       * Приватность: в wasm_used нет ни браузера, ни URL, ни действий —
       * только флаг «пользователь с UUID N пользовался сегодня».
       * Отказ (снят чекбокс) = данные не собираются вовсе.
       * Скрипт не ломает приложение ни на одном шаге (все ошибки — catch).
       */
      (function () {
        var POSTHOG_KEY = "phc_kTAanM7umvZmxTT5fCSbKf6swaYkRaypo5WMD7Y54TBw"; // Project API key (EU cloud, владелец)
        var POSTHOG_HOST = "https://eu.i.posthog.com"; // регион EU; US: https://us.i.posthog.com
        var POSTHOG_CDN = "https://cdn.jsdelivr.net/npm/posthog-js@1/+esm";
        var CONSENT_KEY = "canvasdesk.consent";
        var state = { counter: true, analytics: true, anonId: "", lastWasmDay: null };
        var ph = null;        // PostHog SDK (после успешного импорта)
        var phPending = false; // импорт в полёте (не ретраим без нужды)

        function readConsent() {
          try {
            var raw = window.localStorage.getItem(CONSENT_KEY);
            if (raw) {
              var parsed = JSON.parse(raw);
              if (typeof parsed.counter === "boolean") state.counter = parsed.counter;
              if (typeof parsed.analytics === "boolean") state.analytics = parsed.analytics;
              if (typeof parsed.anonId === "string" && parsed.anonId) state.anonId = parsed.anonId;
              if (typeof parsed.lastWasmDay === "string" || parsed.lastWasmDay === null) {
                state.lastWasmDay = parsed.lastWasmDay;
              }
            }
          } catch (e) { /* приватный режим/битая запись — дефолты true */ }
        }
        function writeConsent() {
          try {
            window.localStorage.setItem(CONSENT_KEY, JSON.stringify(state));
          } catch (e) { /* нет localStorage — телеметрия молча нет */ }
        }

        /* Счётчик: метрика «уникальные пользователи WASM-сервиса».
         * Дедуп — одна отметка в UTC-сутки (lastWasmDay): активные
         * пользователи считаются один раз в день, полный отказ
         * (counter=false) не отправляет ничего. Прямая отправка в
         * /batch/ без SDK — согласие counter не тянет за собой
         * продуктовую аналитику. */
        function todayUTC() { return new Date().toISOString().slice(0, 10); }
        function ensureAnonId() {
          if (!state.anonId) {
            try {
              state.anonId = window.crypto && window.crypto.randomUUID
                ? window.crypto.randomUUID()
                : "cd-" + Date.now().toString(36) + "-" +
                  Math.random().toString(36).slice(2, 10);
            } catch (e) {
              state.anonId = "cd-" + Date.now().toString(36);
            }
          }
          return state.anonId;
        }
        function trackWasmUsed() {
          if (!POSTHOG_KEY || !state.counter) return; // no-op без ключа/согласия
          if (!pickerDone()) return; // свежий визит: пикер не подтверждён
          var today = todayUTC();
          if (state.lastWasmDay === today) return;
          state.lastWasmDay = today;
          writeConsent();
          try {
            fetch(POSTHOG_HOST + "/batch/", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                api_key: POSTHOG_KEY,
                batch: [{
                  event: "wasm_used",
                  distinct_id: ensureAnonId(),
                  properties: { app: "canvadesk-web" }
                }]
              }),
              keepalive: true
            }).catch(function () { /* офлайн/блокировщик — завтра */ });
          } catch (e) { /* блокировщик расширений — молча */ }
        }

        /* «Взаимодействовал с WASM-сервисом» — первый жест пользователя
         * (клик/клавиша/колесо) на странице. once-слушатели дёшевы;
         * дальше дозирует суточный дедуп. Жест, а не загрузка: счётчик
         * меряет использование, не открытия вкладки. */
        function armInteractionTracking() {
          var events = ["pointerdown", "keydown", "wheel"];
          for (var i = 0; i < events.length; i++) {
            window.addEventListener(events[i], trackWasmUsed, { capture: true, once: true });
          }
        }

        /* Свежий визит (пикер ещё не завершён): нет ни согласия, ни
         * конфига в localStorage — телеметрию не грузим и счётчик не
         * отправляем, первое событие уйдёт после выбора (reload).
         * Старые конфиги до FR-089 (конфиг есть, записи согласий нет)
         * считаются согласившимися — дефолты true, как чекбоксы. */
        function pickerDone() {
          try {
            var ls = window.localStorage;
            if (!ls) return true; // приватный режим — дефолты
            return ls.getItem(CONSENT_KEY) !== null ||
              ls.getItem("canvasdesk.config") !== null;
          } catch (e) { return true; }
        }

        /* ─── Продуктовые события (ключ вписан — слой активен) ───
         * Автоматически идут: $pageview + autocapture (клики по DOM:
         * кнопки, меню, пикер — PostHog сам пишет элемент/текст),
         * $exception (installErrorHandlers ниже), wasm_used (суточно,
         * без SDK), app_launched (старт сессии с ролью/языком ниже).
         * Явные события — два способа из кода:
         *  1) JS: window.__cdTelemetry.track("template_used", {tpl: id});
         *  2) DOM-мост для Rust: dispatchEvent CustomEvent
         *     "canvasdesk:track", detail {event, properties}:
         *       web_sys::CustomEvent::new_with_event_init_dict(
         *         "canvasdesk:track",
         *         &CustomEventInit::new().detail(&JsValue::from_serde(
         *           &serde_json::json!({"event": "...", "properties": {...}}))))
         * track() — no-op без ключа/SDK/согласия analytics: отказавшим
         * не отправляется ничего; вызовы из любого кода безопасны. */
        function track(event, properties) {
          if (!ph || !state.analytics) return;
          if (typeof event !== "string" || !event) return;
          try {
            ph.capture(event, properties || {});
          } catch (e) { /* телеметрия не роняет приложение */ }
        }
        document.addEventListener("canvasdesk:track", function (e) {
          var d = e && e.detail;
          if (d && typeof d.event === "string") track(d.event, d.properties || {});
        });

        /* app_launched — старт сессии с контекстом роли/языка: база
         * DAU и распределения ролей; $set обновляет person-свойства
         * (role, language), чтобы ЛЮБЫЕ события делились по ролям в
         * PostHog. Читается из TOML canvasdesk.config (пикер /
         * Rust-персист persist_settings_web). */
        function readProfile() {
          var out = { language: null, role: null };
          try {
            var raw = window.localStorage.getItem("canvasdesk.config");
            if (raw) {
              var m = /(^|\n)[ \t]*language[ \t]*=[ \t]*"([^"\n]*)"/.exec(raw);
              if (m) out.language = m[2];
              var r = /(^|\n)[ \t]*role[ \t]*=[ \t]*"([^"\n]*)"/.exec(raw);
              if (r) out.role = r[2];
            }
          } catch (e) { /* контекст события не критичен */ }
          return out;
        }
        function captureAppLaunched() {
          try {
            var p = readProfile();
            /* FR-090: identify со стабильным anonId (тот же UUID, что у
             * счётчика wasm_used). До этого события висят на анонимном
             * device-id, а PostHog по умолчанию создаёт person-профили
             * только для identified (person_profiles: identified_only) —
             * вкладка People пуста. identify мёржит анонимную историю в
             * person с ролью/языком ($set ниже дополняет при каждом
             * запуске) — «люди с ролями» в People; счётчик wasm_used
             * (distinct_id = тот же anonId) ложится на того же person. */
            try {
              ph.identify(ensureAnonId(), {
                language: p.language || "unset",
                role: p.role || "default"
              });
            } catch (e2) { /* identify не должен ронять app_launched */ }
            ph.capture("app_launched", {
              app: "canvadesk-web",
              language: p.language || "unset",
              role: p.role || "default",
              $set: { language: p.language || "unset", role: p.role || "default" }
            });
          } catch (e) { /* нет события — не поломка */ }
        }

        /* PostHog SDK — динамический import ТОЛЬКО при analytics=true
         * (согласие до загрузки SDK: не грузим скрипт отказавшим).
         * +esm — ESM-сборка jsDelivr, default export = posthog. */
        function loadPostHog() {
          if (!POSTHOG_KEY || phPending || ph) return;
          phPending = true;
          import(POSTHOG_CDN)
            .then(function (mod) {
              var posthog = mod.default;
              posthog.init(POSTHOG_KEY, {
                api_host: POSTHOG_HOST,
                capture_exceptions: true,
                /* FR-091: session replay — захват WASM-канваса. Весь UI
                 * рисуется Rust/wgpu в ОДИН <canvas> (WebGPU, winit
                 * вставляет в body), для rrweb это чёрный ящик: запись
                 * сеанса показывала только DOM-слой (пикер первого
                 * запуска), канвас — пустой. Canvas capture выключен у
                 * PostHog по умолчанию (канвас не маскируется
                 * DOM-механикой) — включаем явно.
                 *
                 * captureCanvas (локальный конфиг, приоритет над
                 * настройками проекта Settings → Session replay):
                 *   recordCanvas  — включить захват;
                 *   canvasFps     — 0–12 кадров/с (дефолт PostHog 4);
                 *   canvasQuality — "0"–"1" (WebP-качество, дефолт 0.4).
                 * canvasCapture.resolutionScale — даунскейл кадров;
                 * ВАЖНО (FR-091 v2, сверено с исходниками lazy-recorder
                 * v1.435.8): локальное resolutionScale ИГНОРИРУЕТСЯ —
                 * масштаб приходит только из удалённого date-default
                 * конфига проекта («defaults 2026-05-30» = 0.6;
                 * подтверждено live: снапшоты 1280×800 → 768×480). Блок
                 * оставлен как документация намерения и на случай
                 * появления локального приоритета в будущих SDK.
                 * Механика (исходники + live-репро 2026-10-03):
                 * FPS-обсервер снапшотит ВСЕ <canvas> в DOM через
                 * createImageBitmap. 2d — читается; webgl/webgl2 —
                 * читается ТОЛЬКО при preserveDrawingBuffer:true (иначе
                 * буфер после композитинга пуст — getContext-шим выше
                 * форсит флаг до создания контекста, перманентно выигрывая
                 * гонку у патча рекордера); webgpu — НЕ читается вовсе
                 * (аналога preserveDrawingBuffer нет,
                 * posthog/posthog#57008), поэтому при analytics=true
                 * canvas-web предпочитает WebGL2-бэкенд
                 * (set_prefer_gl_for_capture, renderer_launch.rs).
                 * Требует posthog-js ≥ 1.105.7 (тянем @1 → 1.435.8).
                 * В записи виден и «видео»-слой WASM, и события FR-090
                 * (surface_opened и т.д.) в таймлайне реплея.
                 *
                 * Приватность: содержимое заметок попадает в записи
                 * (только для согласившихся на аналитику — гейт FR-089).
                 * Для маскировки областей — canvasCapture.maskRegionsFn
                 * (posthog-js ≥ 1.408: пиксели под регионами не покидают
                 * браузер); альтернатива — не включать recordCanvas и
                 * включить захват в настройках проекта (локальные опции
                 * всё равно выигрывают — убрать их, чтобы управлялось из
                 * PostHog). */
                session_recording: {
                  captureCanvas: {
                    recordCanvas: true,
                    canvasFps: 4,
                    canvasQuality: "0.4"
                  },
                  canvasCapture: {
                    resolutionScale: 0.6
                  }
                }
              });
              ph = posthog;
              phPending = false;
              installErrorHandlers();
              captureAppLaunched();
            })
            .catch(function () {
              phPending = false; /* CDN недоступен/офлайн — тихо */
            });
        }

        /* Отчёты об ошибках: $exception по window.error и
         * unhandledrejection. capture_exceptions в init ловит
         * исключения внутри SDK-обёрток — эти листенеры закрывают
         * остальное окно (до/вне SDK событий не собираем: телеметрия
         * строго после согласия). */
        function reportException(type, message, extra) {
          if (!ph || !state.analytics) return;
          try {
            var props = {
              $exception_type: type,
              $exception_message: String(message).slice(0, 500)
            };
            if (extra) {
              if (extra.file) props.$exception_source = String(extra.file).slice(0, 200);
              if (extra.line) props.$exception_lineno = extra.line;
            }
            ph.capture("$exception", props);
          } catch (e) { /* телеметрия не должна ронять приложение */ }
        }
        function installErrorHandlers() {
          window.addEventListener("error", function (e) {
            if (e.message || e.error) {
              reportException("window.error", e.message || String(e.error), {
                file: e.filename, line: e.lineno
              });
            }
          });
          window.addEventListener("unhandledrejection", function (e) {
            var r = e.reason;
            reportException("unhandledrejection", r && r.message ? r.message : String(r));
          });
        }

        /* Смена согласий на лету: Rust (persist_settings_web) пишет
         * canvasdesk.consent и эмитит canvasdesk:consent-changed;
         * storage — кросс-вкладочная синхронизация. Перечитываем JSON,
         * приводим PostHog в соответствие (opt-in/opt-out) без
         * перезагрузки; счётчик просто перестаёт/начинает отправляться. */
        function applyConsentChange() {
          readConsent();
          if (!POSTHOG_KEY) return;
          if (state.analytics && !ph && !phPending) {
            loadPostHog();
          } else if (state.analytics && ph) {
            try { ph.opt_in_capturing(); } catch (e) { /* тихо */ }
          } else if (!state.analytics && ph) {
            try { ph.opt_out_capturing(); } catch (e) { /* тихо */ }
          }
        }
        document.addEventListener("canvasdesk:consent-changed", applyConsentChange);
        window.addEventListener("canvasdesk:consent-changed", applyConsentChange);
        window.addEventListener("storage", function (e) {
          if (e && e.key === CONSENT_KEY) applyConsentChange();
        });

        /* Публичный API (window.__cdTelemetry): getConsent — флаги;
         * setConsent — мерж + перечитать PostHog; trackWasmUsed —
         * счётчик; track(event, props) — продуктовые события из JS
         * (из Rust — CustomEvent canvasdesk:track, см. выше). */
        window.__cdTelemetry = {
          getConsent: function () {
            return { counter: state.counter, analytics: state.analytics };
          },
          setConsent: function (patch) {
            if (patch && typeof patch.counter === "boolean") state.counter = patch.counter;
            if (patch && typeof patch.analytics === "boolean") state.analytics = patch.analytics;
            writeConsent();
            applyConsentChange();
          },
          trackWasmUsed: trackWasmUsed,
          track: track
        };

        /* Boot: согласия читаются синхронно до любых загрузок; пикер
         * (первый вход) уже записал canvasdesk.consent до reload — здесь
         * он существует. Свежий визит (пикер не завершён) — телеметрию
         * не грузим до подтверждения выбора. Старые конфиги до FR-089
         * без записи согласий — дефолты true (как чекбоксы). */
        readConsent();
        if (POSTHOG_KEY && state.analytics && pickerDone()) loadPostHog();
        armInteractionTracking();
      })();
    </script>
    <script>
      /* M8/W4 web-compat шим (wasm-port §7, «WebGPU-драйверные баги
         Chromium» — конкретный случай дрейфа спеки). wgpu 22 просит у
         requestDevice лимит maxInterStageShaderComponents, удалённый из
         WebGPU (переименован в maxInterStageShaderVariables): свежие
         Chromium отклоняют весь запрос из-за нераспознанного имени
         («The limit … is not recognized») — падение замаскировано под
         «GPU-адаптер не найден». Шим удаляет из requiredLimits имена,
         которых нет в limits адаптера (generic-фильтр: переживает и
         будущие переименования); значения распознанных лимитов не
         трогает — запрос лимита выше возможностей адаптера честно
         отклоняется браузером, как в спеке. Правило §3.1: web-костыли
         живут в web-слое (canvas-web), ядро и wgpu не патчатся. */
      (function () {
        if (typeof GPUAdapter === "undefined") return;
        var proto = GPUAdapter.prototype;
        if (!proto || !proto.requestDevice) return;
        var orig = proto.requestDevice;
        proto.requestDevice = function (desc) {
          if (
            desc &&
            desc.requiredLimits &&
            this.limits &&
            typeof this.limits === "object"
          ) {
            // for..in, а не Object.keys: свойства GPUAdapterLimits —
            // геттеры на прототипе (собственных enumerable-ключей нет)
            var known = {};
            for (var limit in this.limits) known[limit] = true;
            var filtered = {};
            var dropped = [];
            for (var key in desc.requiredLimits) {
              if (known[key]) {
                filtered[key] = desc.requiredLimits[key];
              } else {
                dropped.push(key);
              }
            }
            if (dropped.length > 0) {
              console.warn(
                "[canvas-web compat] лимиты не распознаны браузером, исключены из requestDevice: " +
                  dropped.join(", "),
              );
              desc = Object.assign({}, desc, { requiredLimits: filtered });
            }
          }
          return orig.call(this, desc);
        };
      })();
    </script>
    <script>
      /* FR-091 v2: читаемый WebGL2-канвас для session recording (и любых
         внешних читателей растра). PostHog FPS-обсервер снапшотит каждый
         <canvas> через createImageBitmap → WebP. Два платформенных факта
         (воспроизведены на live-сайте 2026-10-03):
         1) WebGL2 drawing buffer после композитинга браузер очищает, если
            контекст создан без preserveDrawingBuffer (дефолт) — readback
            (createImageBitmap / toDataURL) возвращает 100% прозрачный
            растр, при том что compositor показывает отрендеренный кадр.
            Сам PostHog патчит HTMLCanvasElement.prototype.getContext и
            форсит флаг, но его патч ставится после загрузки SDK +
            decide-запроса + lazy-recorder.js — и проигрывает гонку буту
            WASM: wgpu создаёт webgl2-контекст раньше патча. Этот шим
            ставится в <head> синхронно — ДО любых getContext (wgpu,
            gpu_gate-проба, тесты), выбор бэкенда не меняет. Цена —
            сохранённый drawing buffer (незначительно для UI-нагрузки
            редактора; перф-компромисс осознанный).
         2) WebGPU-контекстов шим не касается: у WebGPU аналога
            preserveDrawingBuffer нет, и растр webgpu-канваса рекордер
            PostHog не читает вовсе (posthog/posthog#57008). Поэтому при
            включённом согласии analytics canvas-web предпочитает
            WebGL2-бэкенд (renderer_launch →
            canvas_render::set_prefer_gl_for_capture) — см. Rust-сторону.
         Правило §3.1: web-костыли живут в web-слое. */
      (function () {
        var proto = HTMLCanvasElement.prototype;
        var orig = proto.getContext;
        proto.getContext = function (type, opts) {
          if (
            type === "webgl" ||
            type === "webgl2" ||
            type === "experimental-webgl"
          ) {
            opts = Object.assign({}, opts, { preserveDrawingBuffer: true });
          }
          return orig.call(this, type, opts);
        };
      })();
    </script>
    <script>
      /* M8/W9 шим (wasm-port §7, «WebGPU-драйверные баги Chromium» —
         горячая клавиша против браузерного ускорителя). Ctrl+P —
         продуктовая связка палитры шаблонов (FR-018), но Chromium по
         Ctrl+P открывает диалог печати: winit-web не делает
         preventDefault для браузерных акселераторов, и печать
         поверхностно перехватывает ввод (пауза rAF-насоса winit) —
         палитра «открывается и умирает». Шим в фазе перехвата (до
         listeners winit на канвасе) гасит ТОЛЬКО default-действие
         браузера; событие продолжает распространяться и доходит до
         App (preventDefault не мешает propagation). Кириллица — «з»
         (русская раскладка, ср. on_key в canvas-app). F5/Ctrl+S/F12 не
         трогаем: перезагрузка — часть UX хранения (W6), остальное вне
         продуктовых связок. Правило §3.1: web-костыли — в canvas-web. */
      (function () {
        document.addEventListener(
          "keydown",
          function (e) {
            if (
              (e.ctrlKey || e.metaKey) &&
              !e.shiftKey &&
              !e.altKey &&
              (e.key === "p" || e.key === "P" || e.key === "з" || e.key === "З")
            ) {
              e.preventDefault();
              /* FR-028 v2: optimistic signal for tour engine. The WASM
               * side opens the template palette (template_ui.rs) after
               * receiving the keydown from winit; we don't have a JS API
               * to query canvas-internal state, so emit optimistically.
               * paletteTour scenario's waitFor(signal:"canvas:palette-opened")
               * advances. False positive if the palette fails to open
               * (rare); user can still click "Skip" on the tour. */
              if (window.__canvasdeskTour) {
                setTimeout(function () {
                  window.__canvasdeskTour.signal("canvas:palette-opened");
                }, 120);
              }
            }
          },
          true,
        );
      })();
    </script>
    <script>
      /* FR-028 v2: JS-side signal detection for tour engine. The WASM
       * app creates notes / opens panels in response to user gestures
       * that the JS layer can detect via DOM events on the winit canvas
       * (body > canvas). This shim emits tour signals optimistically —
       * the engine's waitFor(signal) gates advance without Rust-side
       * wiring. Real implementation (AppEvent::TourSignal + drain in
       * canvas-web wrapper) is documented as a TODO; this JS shim is
       * the fallback that makes paletteTour / firstRunInline work in
       * production today. See docs/interface-objects/onboarding-v2-inline.md
       * §6 (TODO: Rust-side signal emission). */
      (function () {
        function emit(name) {
          if (window.__canvasdeskTour) {
            /* Short delay lets the WASM side handle the gesture first;
             * the signal represents "the action happened", not "the

    <script>
      /* FR-028 v2: инициализация inline-тура. Движок поднимается один раз;
         на «Тур» открывается dropdown-меню выбора сценария (замена prompt()).
         URL
         hash #tour=<id> запускает сценарий автоматически — точка входа для
         deeplink-онбординга. Сигналы от WASM-bridge (canvas:note-created,
         canvas:palette-opened) прокидываются через
         canvas_web::tour_signal::emit(name) (Rust-side мост, см.
         crates/canvas-web/src/tour_signal.rs) или напрямую
         window.__canvasdeskTour.signal(name) из JS-слоя. */
      (function () {
        function ready(fn) {
          if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", fn);
          } else { fn(); }
        }
        ready(function () {
          if (!window.CanvasDeskTour) {
            console.warn("[onboarding-v2] CanvasDeskTour bundle missing — " +
              "ensure canvasdesk-tour.js is in dist (Trunk copy-to-dist)");
            return;
          }
          // Issue #63: резолвер GPU-якорей. Чип канваса живёт в правом
          // верхнем углу слева от «?» — его позиция зависит от вьюпорта и
          // угла кластера настроек (localStorage-конфиг, TOML-регекс —
          // паттерн getLanguage выше). Возвращает статический rect-спек;
          // ширина — кап CHIP_MAX_W (156): подсветка тура чуть щедрее
          // фактического чипа с коротким именем, это ок для cutout.
          var tour = new CanvasDeskTour.Tour({
            hooks: {
              resolveAnchor: function (anchor) {
                if (!anchor || anchor.kind !== "selector" ||
                    anchor.selector !== "#gpu-canvas-chip") {
                  return null;
                }
                var vw = window.innerWidth;
                var corner = "top_right";
                try {
                  var cfg = localStorage.getItem("canvasdesk.config");
                  var m = cfg && cfg.match(/^button_corner\s*=\s*"([^"]+)"/m);
                  if (m) { corner = m[1]; }
                } catch (e) { /* нет конфига — дефолт */ }
                var cluster = 4 * 36 + 3 * 8; // ⚙/☼/RU-EN/? = 168
                var right = corner === "top_right"
                  ? vw - 12 - cluster - 8
                  : vw - 12;
                var w = 156; // CHIP_MAX_W
                return {
                  kind: "rect",
                  rect: {
                    x: Math.max(12, right - w),
                    y: 12,
                    width: w,
                    height: 30,
                  },
                };
              },
            },
          });
          window.__canvasdeskTour = tour;  // host hook: signal("canvas:note-created")
          // Issue #60 (W-WEBUI): «Тур…» — GPU-подменю меню канваса шлёт
          // сигнал "ui:run-tour:<id>" (push_tour_signal → TourAwareApp
          // drain → сюда); DOM #tour-menu удалён вместе с #w6-toolbar.
          tour.onSignal(function (name) {
            if (name.indexOf("ui:run-tour:") === 0) {
              var id = name.slice("ui:run-tour:".length);
              var lang2 = (window.__canvasdesk && window.__canvasdesk.getLanguage)
                ? window.__canvasdesk.getLanguage() : "ru";
              var table = (lang2 === "en" && scenarios.en) ? scenarios.en : scenarios;
              for (var k in table) {
                if (table[k] && table[k].id === id) { tour.run(table[k]); break; }
              }
            }
          });
          var scenarios = CanvasDeskTour.scenarios;

          // Авто-запуск по URL hash: #tour=cd-toolbar-tour
          if (location.hash && location.hash.indexOf("#tour=") === 0) {
            var id = location.hash.slice("#tour=".length);
            for (var k in scenarios) {
              if (scenarios[k].id === id) {
                tour.run(scenarios[k]);
              }
            }
          }

        });
      })();
    </script>
