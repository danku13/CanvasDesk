[package]
publish = false # внутренний крейт закрытого продукта; не публикуется на crates.io (CP0, ADR-0008)
name = "canvas-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "LLM-слой CanvasDesk: унифицированный LlmProvider trait для 6 провайдеров (BYOK + Sign-in-with-ChatGPT)"

# FR-LLM-A / ADR-0016: чистый трейт-слой без зависимостей в дефолтной сборке.
# Сетевые зависимости (ureq) и serde-деривы включаются только за feature
# `l1-llm` (правило ADR-0011 wasm-гейт, AGENTS.md «без сети в хосте»).
# Трейт и типы компилируются под wasm32-unknown-unknown без оговорок
# (default features = []) — потребительские крейты (canvas-app/canvas-suggest)
# подключают сеть только за явным feature-флагом.
[dependencies]
# Все зависимости — optional, активируются только за feature `l1-llm`.
# Это сохраняет zero-dep дефолтное дерево и wasm-гейт (ADR-0011).
ureq = { version = "2", default-features = false, features = ["json"], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { version = "0.10", optional = true }
async-trait = { version = "0.1", optional = true }
# FR-LLM-OAUTH (Stream D): PKCE/state/nonce — ОС-энтропия через getrandom
# (минимальный стандартный источник CSPRNG; time/address-хаки запрещены).
# На нативе — getentropy/BCryptGenRandom/urandom; версия 0.3 уже в дереве
# (транзитивно). Включается только за `l1-llm` — дефолтное дерево не растёт.
# W1 (wave-1): feature wasm_js — выбор JS-бэкенда (crypto.getRandomValues)
# под wasm32-unknown-unknown; активируется только на браузерной цели в паре
# с --cfg=getrandom_backend="wasm_js" (.cargo/config.toml, wasm32-секция).
# На нативных целях фича инертна (выбор бэкенда гейтится по target).
getrandom = { version = "0.3", optional = true, features = ["wasm_js"] }
# FR-LLM-OAUTH (Stream D): unix-время для expires_at — web-time вместо
# std::time::SystemTime (M8/W1: wasm32-безопасный alias через JS Date;
# wasm-гейт времени FR-079 S3-fix). Уже в дереве через winit.
web-time = { workspace = true, optional = true }

# W1 (wave-1): wasm-fetch — браузерный fetch-транспорт (F-5.10). Optional
# deps включаются ТОЛЬКО за feature `wasm-fetch` (не в default!): дефолтная
# wasm-сборка canvas-web остаётся без сети (ADR-0011), реальное включение
# фичи — волна W3. Версии — из workspace-дерева (уже зафоршенены через winit/trunk).
web-sys = { workspace = true, optional = true, features = [
    "Window",
    "Request",
    "RequestInit",
    "Response",
    "Headers",
] }
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }

[dev-dependencies]
# только для тестовых фикстур: разбор JSON-ответов провайдеров
serde.workspace = true
serde_json.workspace = true
# FR-LLM-OAUTH: исполнение async-методов трейта в тестах без tokio
# (embed → NotSupported и т.п.). Не входит в сборку крейта — только тесты.
pollster = { workspace = true }

[features]
default = []
# FR-LLM-A: serde-деривы на типах (Message, ToolDef, Settings, …) и доступность
# `serde_json::Value` в публичном API. Может включаться независимо от
# сетевого слоя (например, для логирования ToolCall в JSON без ureq).
serde = ["dep:serde", "dep:serde_json"]
# FR-LLM-A: сетевой слой LLM-провайдеров (ureq no-TLS, http-only).
# Включает трейт с async-методами + serde-деривы типов + адаптеры
# OpenAI-compat и Anthropic. Для HTTPS-эндпоинтов (api.openai.com и т.п.)
# используйте `l1-llm-tls`.
l1-llm = [
    "serde",
    "dep:ureq",
    "dep:sha2",
    "dep:async-trait",
    # FR-LLM-OAUTH (Stream D): CSPRNG для PKCE/state/nonce + wasm-безопасное время.
    "dep:getrandom",
    "dep:web-time",
]
# FR-LLM-A: TLS для HTTPS-эндпоинтов (desktop). Подключает `ureq/tls`,
# который тянет rustls/webpki-roots. wasm-сборка TLS не использует
# (web-sys::fetch + cloud-proxy).
l1-llm-tls = ["l1-llm", "ureq/tls"]
# W1 (wave-1): браузерный fetch-транспорт для web-пути (F-5.10). Подразумевает
# `l1-llm` (типы транспорта за ней). ВАЖНО (ADR-0011): фича легальна только
# под wasm32-целью — на нативных сборках compile_error! (см. transport.rs);
# в default НЕ включена — canvas-web активирует её в волне W3.
wasm-fetch = [
    "l1-llm",
    "dep:web-sys",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
]
