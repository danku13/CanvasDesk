[package]
publish = false # внутренний крейт закрытого продукта; не публикуется на crates.io (CP0, ADR-0008)
name = "canvas-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
canvas-core.workspace = true
# FR-052 (U2 PRD-0009): типы полос экрана (UiLayer/ScreenBand) — внутренний
# workspace-крейт каркаса canvas-ui (0 внешних зависимостей — G7)
canvas-ui.workspace = true
# FR-037 MW1 (ребейз): view-модель сцены (SpillView/WhatIfNode) живёт в
# canvas-scene — рендер реэкспортирует (слои: core → scene → render → app)
canvas-scene.workspace = true
anyhow.workspace = true
winit.workspace = true
wgpu.workspace = true
glyphon.workspace = true
cosmic-text.workspace = true
tracing.workspace = true
# M8/W4 (wasm-port §3.4): блокировка Renderer::new в натив-стратегии
# BlockOnRendererLaunch (renderer_init); на wasm pollster компилируется,
# но не вызывается (web — spawn_local в canvas-web)
pollster.workspace = true

# FR-WASM-02: WebGL2-фолбэк на web. wgpu 22 по умолчанию собирает на wasm
# ТОЛЬКО BrowserWebGPU (features: wgsl/dx12/metal/webgpu) — браузеры без
# WebGPU (Firefox/Safari, Chrome с выключенным аппаратным ускорением)
# получали «GPU-адаптер не найден» → тихий чёрный экран. Фича webgl
# добавляет GLES-бэкенд (WebGL2). Только для wasm-цели: натив не тянет
# GLES-зависимости wgpu-hal. Storage-буферы не используются (ни здесь,
# ни в glyphon 0.6) — рендер укладывается в downlevel-лимиты (gpu.rs).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgl"] }
# FR-WEBGPU-DIAG: retry request_adapter на web через setTimeout (Promise).
# web-sys/js-sys/wasm-bindgen-futures нужны для wait_briefly() в gpu.rs.
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys.workspace = true

[dev-dependencies]
# FR-WASM-02 §7: wasm-тесты чистой логики рендера (clamp_surface_extent и
# др.). wasm_bindgen_test исполняется в браузере/wasm-рантайме через
# wasm-bindgen-test-runner; на нативных целях макрос раскрывается в
# заглушки (контрольная сборка под x86_64 зелёная). cargo test --target
# wasm32-unknown-unknown -p canvas-render --test wasm_clamp запускает
# эти тесты; для компиляции без запуска — wasm_gate.sh ступень 1.
# Через target-specific dependency — wasm-bindgen-test не тащится в
# нативные сборки (его JS-only крейт jemalloc-sys иначе провоцирует
# разовые сбои на свежих nightly).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true
