[package]
publish = false # внутренний крейт закрытого продукта; не публикуется на crates.io (CP0, ADR-0008)
name = "canvas-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "canvas_app"
path = "src/lib.rs"

[[bin]]
# Имя дистрибутива (README/FR-008): canvasdesk / canvasdesk.exe.
# Пакет остаётся canvas-app (workspace-пути и -p-флаги не меняются).
name = "canvasdesk"
path = "src/main.rs"

[dependencies]
canvas-core.workspace = true
canvas-render.workspace = true
# FR-052 (U2 PRD-0009): каркас canvas-ui — реестр поверхностей, HitStack,
# KeyboardRouter; единый диспетчер ввода и draw-полос (0 внешних — G7)
canvas-ui.workspace = true
canvas-mcp.workspace = true
# FR-037/ADR-0012: SceneState + MCP-инструменты (перенесены из main.rs)
canvas-scene.workspace = true
# M5 (T20): менеджер виджетов — реестр/LOD/host над canvas-widgets
canvas-widgets.workspace = true
# FR-079 (S3): suggest-движок (гибрид lex+Laya). Дефолтная сборка — чистое
# ядро без ML/сетевых зависимостей; транспорт L1 включается feature-флагом
# ниже (не входит в дефолт и в wasm-гейт)
canvas-suggest.workspace = true
# FR-LLM-B / PRD-0010 F-7: LLM-слой — типы `LlmSettings`/`LlmProviderId`/
# `DataResidency` читаются из `Settings` для отрисовки 9-го таба настроек и
# статусной панели. Дефолтная сборка без сети (ADR-0011 wasm-гейт); serde-
# деривы включаются за feature `serde` — нужно для персиста `LlmSettings`
# в `config.toml` через `Settings::save`.
canvas-llm = { workspace = true, features = ["serde"] }
# FR-LLM-D / PRD-0010 F-3: генератор графов из текста через LLM
# (.byok → .canvas JSON). Дефолтная сборка без сети (wasm-гейт); feature
# `l1-llm` (ниже в [features]) подключает canvas-llm/l1-llm — для
# нативной (desktop) сборки. UI (`graph_builder_ui.rs`) использует только
# `GraphBuilderMode` enum (доступен без фичи).
canvas-graph-builder = { workspace = true }
anyhow.workspace = true
# FR-LLM-D-W2 (llm-waves §3.7): block_on async-футур LLM-задач в воркере
# executor-сима. pollster — уже НЕПРЕРЫВНО в дереве (workspace-версия из
# canvas-render, безусловная зависимость app) — прямое подключение не
# добавляет ни одного нового крейта в lock (llm-waves §0.3: новых внешних
# зависимостей нет). Optional: реального исполнителя тянет только l1-llm.
pollster = { workspace = true, optional = true }
# FR-LLM-D-W2 (llm-waves §3.2/§3.8): обёртка Box<dyn LlmProvider> под
# generic-движки canvas-llm/canvas-suggest (GraphBuilder<P>/LlmMmSource<P> —
# impl трейта для обёртки). async-trait 0.1 — уже в дереве за l1-llm
# (canvas-llm/dep:async-trait) и в dev-зависимостях canvas-graph-builder —
# прямое подключение за l1-llm не добавляет новых крейтов (§0.3).
async-trait = { version = "0.1", optional = true }
# FR-053 (U3 PRD-0009 F-6): тип FontSystem в сигнатурах раскладки пилотов
# (TextMeasurer canvas-ui принимает &mut FontSystem — владелец инстанса
# canvas-render::text). Уже в workspace (рендер) — не новая зависимость (G7).
cosmic-text.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
winit.workspace = true
# M8/W4 (wasm-port §3.4): pollster ушёл из app — блокировка Renderer::new
# переехала в инъектируемую стратегию canvas-render::renderer_init
# (натив — BlockOnRendererLaunch внутри canvas-render, web — spawn_local)

# M8/W3 (wasm-port §3.1): нативная shell-платформа — только для нативных
# целей (её использует бинарь main.rs); wasm-сборка библиотеки (для
# canvas-web, W4) shell не тянет — платформенные сервисы инъектируются
# через нейтральные трейты core (CanvasStorage/ClipboardBackend/
# WatchBackend/SearchBackend/ThumbBackend)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
canvas-shell.workspace = true

[features]
# FR-079 (S3): L1-транспорт к sidecar laya-serve (ureq no-TLS, только
# localhost). OFF по умолчанию: сетевых зависимостей в дефолтном дереве
# нет (правило AGENTS.md «без сети в хосте»; sidecar — отдельный процесс).
default = []
l1-laya = ["canvas-suggest/l1-laya"]
# FR-LLM-D / PRD-0010 F-3: L1-транспорт для генератора графов (через
# canvas-graph-builder/l1-llm → canvas-llm/l1-llm). OFF по умолчанию —
# сетевых зависимостей в дефолтном дереве нет (wasm-гейт ADR-0011);
# подключается в нативной (desktop) сборке.
l1-llm = [
    "canvas-graph-builder/l1-llm",
    "canvas-llm/l1-llm",
    # FR-LLM-D-W2 (§3.8): LlmMmSource suggest-mm (wasm-ветка) — L1-слой
    # canvas-suggest (redact+cache+choice; ureq НЕ тянет — это l1-laya).
    "canvas-suggest/l1-llm",
    "dep:pollster",
    "dep:async-trait",
]
# FR-LLM-OAUTH-APP / PRD-0010 F-5.1–F-5.8: OAuth-эндпоинты Sign-in-with-
# ChatGPT HTTPS (auth.openai.com / api.openai.com) — TLS нужен только в
# нативной сборке (ureq/rustls); wasm не трогаем (ADR-0011: web-путь —
# fetch + cloud-proxy, F-5.10). Включает l1-llm и тянет canvas-llm/
# l1-llm-tls (там же автентификация OAuth-клиента).
l1-llm-tls = ["l1-llm", "canvas-llm/l1-llm-tls"]

# FR-040 v2 (web persist): на wasm32 настройки сохраняются в localStorage
# браузера (натив — config.toml через `Settings::save(path)`). Трейты
# core (ClipboardBackend/…) — аналогичный паттерн, но конфиг меняется
# редко и в 4 точках — простая cfg-специализация без инъекции трейта.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# FR-089: Event/EventTarget — эмит canvasdesk:consent-changed из
# persist_settings_web (смена согласий телеметрии → JS-модуль index.html
# применяет PostHog opt-in/out без перезагрузки).
# FR-090: + Document/CustomEvent/CustomEventInit и js-sys — отправка
# продуктовых событий из Rust мостом canvasdesk:track (app/telemetry.rs).
web-sys = { workspace = true, features = [
    "Window",
    "Storage",
    "Event",
    "EventTarget",
    "Document",
    "CustomEvent",
    "CustomEventInit",
] }
wasm-bindgen.workspace = true
js-sys.workspace = true
toml.workspace = true

[dev-dependencies]
# S3-fix (FR-079): тест формата конфига движка — derive Deserialize
# на локальной структуре (нижний регистр + легаси-alias); toml в main-
# дереве только под wasm32 (конфиг localStorage), тестам нужен и натив
serde.workspace = true
toml.workspace = true

