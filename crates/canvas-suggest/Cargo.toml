[package]
publish = false # внутренний крейт закрытого продукта; не публикуется на crates.io (CP0, ADR-0008)
name = "canvas-suggest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "FR-079: suggest-движок — гибрид lex+Laya (чистое ядро, std-only, wasm-safe)"

# S1 (FR-079): чистое ядро без зависимостей — BM25/char3/синонимы/гейты.
# Сетевых и ML-зависимостей в дефолтном дереве нет (правило AGENTS.md:
# «не добавлять сетевые вызовы в хост»). L1-транспорт — feature `l1-laya` (S2).
[dependencies]
# только за feature `l1-laya` (off by default): дефолтное дерево остаётся
# без сетевых/ML-зависимостей (правило AGENTS.md «без сети в хосте»;
# sidecar — отдельный процесс, клиент говорит только с localhost)
ureq = { version = "2", default-features = false, features = ["json"], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
# только для golden-тестов: разбор JSONL-фикстур PoC
serde.workspace = true
serde_json.workspace = true

[features]
default = []
# S2: HTTP-клиент /v1/systemone (ureq no-TLS, только localhost) +
# менеджер sidecar + sha256-манифест весов.
l1-laya = ["dep:ureq", "dep:serde", "dep:serde_json", "dep:sha2"]
