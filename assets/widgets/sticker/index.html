<!DOCTYPE html>
<!-- Встроенный виджет CanvasDesk «Стикер» (T21-D): contenteditable-текст
     -> props.text с debounce 400 мс (undo-коалесценция на стороне хоста).
     Bridge v0 — прямой postMessage (T22 формализует в sdk/canvasdesk.ts). -->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'">
<style>
  :root {
    --bg: #2a2f1e; --fg: #f2f0e0; --muted: #9aa07f; --accent: #3B82F6;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: flex; flex-direction: column; box-sizing: border-box;
    background: var(--bg); color: var(--fg); padding: 12px;
    font-family: "Segoe UI", "Inter", system-ui, sans-serif;
    border-radius: 6px;
  }
  #hint { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  #text {
    flex: 1; outline: 0; overflow-y: auto;
    font-size: 14px; line-height: 1.45; caret-color: var(--accent);
  }
  #text:empty::before { content: attr(data-ph); color: var(--muted); }
</style>
</head>
<body>
  <div id="hint">Стикер — текст сохраняется в канвас</div>
  <div id="text" contenteditable="true" data-ph="Пишите здесь…" spellcheck="false"></div>
<script>
(function () {
  "use strict";
  var elText = document.getElementById("text");
  var props = { text: "" };
  var timer = null;
  var applying = false; // propsChanged из хоста не эхом в setProps

  function applyTheme(theme) {
    if (!theme) return;
    var root = document.documentElement.style;
    root.setProperty("--bg", theme.dark ? "#2a2f1e" : "#f7f4dd");
    root.setProperty("--fg", theme.dark ? "#f2f0e0" : "#26291a");
    root.setProperty("--muted", theme.dark ? "#9aa07f" : "#7a7f5c");
    root.setProperty("--accent", theme.accent || "#3B82F6");
  }

  function send(method, params) {
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage({
        jsonrpc: "2.0", method: method, params: params || {}
      });
    }
  }

  function commit() {
    timer = null;
    if (applying) return;
    var text = elText.innerText;
    if (text === (props.text || "")) return;
    props.text = text;
    send("setProps", { props: props });
  }

  elText.addEventListener("input", function () {
    if (applying) return;
    if (timer !== null) clearTimeout(timer);
    timer = setTimeout(commit, 400); // debounce: меньше setProps-потока
  });

  window.addEventListener("message", function (event) {
    var msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") return;
    switch (msg.method) {
      case "init":
        applyTheme(msg.params && msg.params.theme);
        if (msg.params && msg.params.props && typeof msg.params.props.text === "string") {
          applying = true;
          elText.innerText = msg.params.props.text;
          applying = false;
          props.text = msg.params.props.text;
        }
        break;
      case "propsChanged":
        if (msg.params && msg.params.props && typeof msg.params.props.text === "string"
            && msg.params.props.text !== elText.innerText) {
          applying = true;
          elText.innerText = msg.params.props.text;
          applying = false;
          props.text = msg.params.props.text;
        }
        break;
      case "themeChanged":
        applyTheme(msg.params && msg.params.theme);
        break;
      case "visibility":
        // потеря фокуса при уходе в снапшот — фиксируем черновик
        if (timer !== null) { clearTimeout(timer); commit(); }
        break;
    }
  });

  send("ready");
})();
</script>
</body>
</html>
