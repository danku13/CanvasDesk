<!DOCTYPE html>
<!-- Встроенный виджет CanvasDesk «Календарь» (T21-D, T22 — миграция на SDK):
     месяц × дни, клик дня — заметка (props.notes: {"YYYY-MM-DD": "текст"}).
     Мост — sdk/canvasdesk.js (глобал CanvasDesk), логика — app.js.
     Все скрипты внешние: CSP default-src 'self' (inline блокировался —
     исправлено в T22). -->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'">
<style>
  :root {
    --bg: #1e2430; --fg: #e8ecf4; --muted: #8a93a6;
    --accent: #3B82F6; --cell: #262e3d; --cell-hover: #313b4e;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: flex; flex-direction: column; box-sizing: border-box;
    background: var(--bg); color: var(--fg); padding: 10px;
    font-family: "Segoe UI", "Inter", system-ui, sans-serif;
    border-radius: 6px; user-select: none;
  }
  #head { display: flex; align-items: center; justify-content: space-between; }
  #head b { font-size: 15px; text-transform: capitalize; }
  #head button {
    background: var(--cell); color: var(--fg); border: 0; border-radius: 4px;
    width: 26px; height: 22px; cursor: pointer; font-size: 13px;
  }
  #head button:hover { background: var(--cell-hover); }
  #grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px;
    flex: 1; margin-top: 8px;
  }
  .dow { font-size: 10px; color: var(--muted); text-align: center; padding: 2px 0; }
  .day {
    background: var(--cell); border-radius: 4px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; position: relative;
  }
  .day:hover { background: var(--cell-hover); }
  .day.today { outline: 1.5px solid var(--accent); }
  .day.hasnote::after {
    content: ""; position: absolute; bottom: 4px; left: 50%;
    width: 4px; height: 4px; margin-left: -2px; border-radius: 50%;
    background: var(--accent);
  }
  .day.selected { background: var(--accent); color: #fff; }
  #note {
    margin-top: 8px; border: 0; border-radius: 4px; box-sizing: border-box;
    background: var(--cell); color: var(--fg); padding: 7px 9px;
    font: 13px "Segoe UI", system-ui, sans-serif; resize: none;
    height: 52px; display: none;
  }
</style>
</head>
<body>
  <div id="head">
    <button id="prev" title="Предыдущий месяц">&#9664;</button>
    <b id="month">&nbsp;</b>
    <button id="next" title="Следующий месяц">&#9654;</button>
  </div>
  <div id="grid"></div>
  <textarea id="note" placeholder="Заметка на день (Enter — сохранить)"></textarea>
  <script src="canvasdesk.js"></script>
  <script src="app.js"></script>
</body>
</html>
