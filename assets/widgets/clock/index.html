<!DOCTYPE html>
<!-- Встроенный виджет CanvasDesk «Часы» (T20, T22 — миграция на SDK):
     цифровые часы + дата, тикают пока видимы (visibility), тема из init.
     Мост — sdk/canvasdesk.js (глобал CanvasDesk), логика — app.js.
     Все скрипты внешние: CSP default-src 'self' их разрешает (раньше
     inline-<script> блокировался собственной CSP — исправлено в T22). -->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'">
<style>
  :root {
    --bg: #1e2430;
    --fg: #e8ecf4;
    --muted: #8a93a6;
    --accent: #3B82F6;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--bg); color: var(--fg);
    font-family: "Segoe UI", "Inter", system-ui, sans-serif;
    border-radius: 6px; box-sizing: border-box;
  }
  #time { font-size: 56px; font-weight: 600; letter-spacing: 2px; line-height: 1; }
  #time span { color: var(--accent); }
  #date { margin-top: 10px; font-size: 15px; color: var(--muted); text-transform: capitalize; }
</style>
</head>
<body>
  <div id="time">--<span>:</span>--<span>:</span>--</div>
  <div id="date">&nbsp;</div>
  <script src="canvasdesk.js"></script>
  <script src="app.js"></script>
</body>
</html>
