/* ============================================================
   CanvasDesk — 404 / rebuild page (onepager)
   Дизайн-система: точная копия токенов лендинга CanvasDesk v5
   (dark → retrowave/neonwave, light → «бумага»), типографика
   продукта: Noto Sans Display / Noto Sans Mono / Unbounded.
   Страница самодостаточна: один файл, без внешних ассетов,
   кроме Google Fonts (с системными фолбэками).
   Логика: GitHub Pages отдаёт 404.html и во время пересборки
   WASM-бандла, и для несуществующих путей. JS различает эти
   состояния и либо показывает «обновляемся» с авто-retry,
   либо «страница не найдена» со ссылками.
   ============================================================ */

/* ===== Design tokens (копия лендинга) ===== */
:root{
  --font-b:'Noto Sans Display',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-m:'Noto Sans Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --font-d:'Unbounded',system-ui,sans-serif;
}
[data-theme="dark"]{
  --bg:#0a0118;--bg2:#150a2e;--tint:rgba(124,58,237,.07);
  --card:rgba(24,10,52,.5);--card-solid:#170b33;
  --line:#31205f;--line-soft:rgba(139,92,246,.22);
  --txt:#f4efff;--txt2:#ddd1fa;--mut:#a795d6;--mut2:#7f6cb4;--dim:#5a4889;
  --acc:#ff2ec4;--acc2:#00e5ff;--acc3:#8b5cf6;
  --teal:#00e5ff;--rose:#ff5c8a;--ok:#34d399;
  --acc-soft:rgba(255,46,196,.08);
  --dot-c:rgba(255,255,255,.05);
  --head-bg:rgba(10,1,24,.82);
  --ann-bg:linear-gradient(90deg,#ff2ec4,#7c3aed 55%,#0090c8);
  --ann-fg:#ffffff;
  --btn-bg:linear-gradient(135deg,#ff2ec4,#7c3aed);
  --btn-fg:#ffffff;
  --btn-glow:0 0 26px rgba(255,46,196,.4),0 12px 32px rgba(124,58,237,.28);
  --pill-on-bg:#ff2ec4;--pill-on-fg:#fff;
  --term-bg:#05010e;--term-fg:#ddd1fa;
  --num-c:#00e5ff;
  --g404:linear-gradient(92deg,#ff2ec4,#8b5cf6 52%,#00e5ff);
  --g404-glow:drop-shadow(0 0 28px rgba(255,46,196,.3));
  --o1:rgba(255,46,196,.14);--o2:rgba(0,229,255,.1);
  --r-card:16px;--r-pill:99px;--r-btn:99px;
}
[data-theme="light"]{
  --bg:#faf7f1;--bg2:#f1ebdf;--tint:#f1ebdf;
  --card:#fffdf9;--card-solid:#ffffff;
  --line:#e0d8c8;--line-soft:rgba(30,26,20,.14);
  --txt:#1e1a14;--txt2:#403a30;--mut:#6f675a;--mut2:#918878;--dim:#b5ab97;
  --acc:#c2410c;--acc2:#1e1a14;--acc3:#a16207;
  --teal:#a16207;--rose:#b3372c;--ok:#15803d;
  --acc-soft:rgba(194,65,12,.06);
  --dot-c:rgba(30,26,20,.07);
  --head-bg:rgba(250,247,241,.86);
  --ann-bg:#1e1a14;--ann-fg:#faf7f1;
  --btn-bg:#1e1a14;--btn-fg:#faf7f1;
  --btn-glow:none;
  --pill-on-bg:#1e1a14;--pill-on-fg:#faf7f1;
  --term-bg:#211c15;--term-fg:#efe9dc;
  --num-c:#1e1a14;
  --g404:linear-gradient(92deg,#c2410c,#a16207);
  --g404-glow:none;
  --o1:rgba(194,65,12,.1);--o2:rgba(124,58,237,.08);
  --r-card:10px;--r-pill:8px;--r-btn:8px;
}

/* ===== Base ===== */
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important} /* display:block терминальных строк не должен перебивать hidden */
html,body{height:100%}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body{background:var(--bg);color:var(--txt);font:16px/1.6 var(--font-b);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;position:relative;overflow-x:clip}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
.wrap{max-width:80rem;margin:0 auto;padding:0 1rem;width:100%}
@media(min-width:640px){.wrap{padding:0 1.5rem}}
@media(min-width:1024px){.wrap{padding:0 2rem}}

/* Фон: точечная сетка как в hero лендинга + неоновые пятна */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(var(--dot-c) 1px,transparent 1px);background-size:26px 26px}
.orb{position:fixed;z-index:0;pointer-events:none;border-radius:50%;filter:blur(70px)}
.o1{width:38rem;height:38rem;left:-12rem;top:-14rem;background:var(--o1)}
.o2{width:30rem;height:30rem;right:-10rem;bottom:-12rem;background:var(--o2)}

/* ===== Announcement bar ===== */
#announcement{position:relative;z-index:2;background:var(--ann-bg);color:var(--ann-fg)}
#announcement .in{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.35rem .6rem;padding:.5rem 1rem;text-align:center;font-size:.8rem;font-weight:500}
@media(min-width:640px){#announcement .in{font-size:.875rem}}
.pulse{position:relative;display:inline-flex;height:.5rem;width:.5rem;flex:none}
.pulse i{position:absolute;inset:0;border-radius:99px;background:currentColor;opacity:.6;animation:ping 1.6s cubic-bezier(0,0,.2,1) infinite}
.pulse b{position:relative;height:.5rem;width:.5rem;border-radius:99px;background:currentColor}
@keyframes ping{75%,100%{transform:scale(2.2);opacity:0}}

/* ===== Header ===== */
header.site{position:relative;z-index:2;border-bottom:1px solid var(--line-soft);background:var(--head-bg);backdrop-filter:blur(12px)}
.hrow{display:flex;height:4rem;align-items:center;justify-content:space-between;gap:1rem}
.logo{display:flex;align-items:center;gap:.625rem}
.logo .mark{display:flex;height:2.25rem;width:2.25rem;align-items:center;justify-content:center;border-radius:.75rem;background:var(--btn-bg);color:var(--btn-fg);box-shadow:var(--btn-glow)}
.logo .name{font-size:1.125rem;font-weight:700;letter-spacing:-.02em}
.logo .name b{color:var(--acc);font-weight:700}
.hactions{display:flex;align-items:center;gap:.5rem}
.lang-pills{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--r-pill);padding:.125rem}
.lang-pills button{border-radius:var(--r-pill);padding:.25rem .625rem;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.lang-pills button.on{background:var(--pill-on-bg);color:var(--pill-on-fg)}
.lang-pills button:not(.on):hover{color:var(--txt)}
.tbtn{display:inline-flex;height:2.5rem;width:2.5rem;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:var(--r-pill);color:var(--txt2);transition:.15s}
.tbtn:hover{color:var(--acc);border-color:var(--acc)}
.tbtn .imoon{display:none}
[data-theme="light"] .tbtn .isun{display:none}
[data-theme="light"] .tbtn .imoon{display:inline-flex}

/* ===== Hero / 404 ===== */
main{position:relative;z-index:1;flex:1;display:flex;align-items:center}
.center{max-width:48rem;margin:0 auto;text-align:center;padding:3rem 0}
.badge{display:inline-flex;align-items:center;gap:.5rem;border-radius:var(--r-pill);border:1px solid var(--line);padding:.375rem 1rem;font-size:.8rem;font-weight:500;color:var(--txt2);font-family:var(--font-m)}
@media(min-width:640px){.badge{font-size:.875rem}}
.badge .dot{position:relative;display:flex;height:.5rem;width:.5rem}
.badge .dot i{position:absolute;inset:0;border-radius:99px;background:var(--acc);opacity:.6;animation:ping 1.6s cubic-bezier(0,0,.2,1) infinite}
.badge .dot b{position:relative;height:.5rem;width:.5rem;border-radius:99px;background:var(--acc)}
.badge.up .dot i{background:var(--ok)}
.badge.up .dot b{background:var(--ok)}
.g404{margin-top:2rem;font-family:var(--font-d);font-weight:900;font-size:clamp(4.2rem,9vw + 1.6rem,9rem);line-height:1;letter-spacing:.02em;background-image:var(--g404);-webkit-background-clip:text;background-clip:text;color:transparent;filter:var(--g404-glow)}
h1{margin-top:1.5rem;font-family:var(--font-d);font-weight:700;font-size:clamp(1.4rem,1.1rem + 1.4vw,2.1rem);letter-spacing:-.01em;line-height:1.25;color:var(--txt)}
h1 .acc{color:var(--acc)}
.sub{margin:1.25rem auto 0;max-width:40rem;color:var(--mut);font-size:1rem;line-height:1.65}
@media(min-width:640px){.sub{font-size:1.05rem}}

/* ===== Terminal (как в hero лендинга) ===== */
.terminal{max-width:44rem;margin:2.25rem auto 0;overflow:hidden;border:1px solid var(--line);background:var(--term-bg);border-radius:var(--r-card);box-shadow:0 20px 40px rgba(0,0,0,.2);text-align:left}
[data-theme="light"] .terminal{border-color:var(--term-bg)}
.terminal .bar{display:flex;align-items:center;gap:.5rem;border-bottom:1px solid var(--line-soft);padding:.7rem 1.1rem}
.terminal .bar .dt{height:.7rem;width:.7rem;border-radius:99px}
.terminal .bar .t{margin-left:.35rem;font-size:.8rem;font-weight:600;color:var(--txt2);font-family:var(--font-m)}
.terminal pre{overflow-x:auto;padding:1rem 1.25rem;font-family:var(--font-m);font-size:.8125rem;line-height:1.75;color:var(--term-fg)}
@media(max-width:480px){.terminal pre{font-size:.72rem}}
.terminal pre .dollar{margin-right:.75rem;color:var(--acc);user-select:none}
.terminal pre span.l{display:block;white-space:pre-wrap;word-break:break-word}
.terminal pre .cy{color:var(--num-c)}
.terminal pre .ok{color:var(--ok)}
.terminal pre .warn{color:var(--rose)}
.terminal pre .mut{color:var(--mut2)}
/* Светлая тема: терминал остаётся тёмным — акценты внутри него
   должны читаться на тёмном фоне, поэтому локальные оверрайды */
[data-theme="light"] .terminal pre .cy{color:#f0b455}
[data-theme="light"] .terminal pre .ok{color:#7ee2a8}
[data-theme="light"] .terminal pre .warn{color:#ff8f9e}
[data-theme="light"] .terminal pre .dollar{color:#ff5c8a}
.cursor{display:inline-block;width:.55em;height:1.05em;vertical-align:-.15em;background:var(--acc2);animation:blink 1.1s steps(1) infinite;margin-left:.15rem}
@keyframes blink{50%{opacity:0}}

/* ===== Actions ===== */
.ctas{margin-top:1.9rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.75rem}
@media(min-width:640px){.ctas{flex-direction:row;flex-wrap:wrap}}
.ctas .btn{width:100%}
@media(min-width:640px){.ctas .btn{width:auto}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:var(--r-btn);padding:.75rem 1.6rem;font-weight:600;transition:.2s}
.btn-amber{background:var(--btn-bg);color:var(--btn-fg);box-shadow:var(--btn-glow)}
.btn-amber:hover{filter:brightness(1.12);transform:translateY(-2px)}
.btn-ghost{border:1px solid var(--line);background:transparent;color:var(--txt)}
[data-theme="light"] .btn-ghost{background:var(--card)}
.btn-ghost:hover{border-color:var(--acc);color:var(--acc)}
.btn-link{padding:.5rem .75rem;font-size:.875rem;font-weight:500;color:var(--mut)}
.btn-link:hover{color:var(--acc);text-decoration:underline;text-underline-offset:4px}
.noscript{margin-top:1.25rem;font-size:.85rem;color:var(--rose)}

/* ===== Community (Telegram / Discord) ===== */
.ask{margin-top:1.9rem;font-size:.85rem;color:var(--mut2)}
.community{margin-top:.65rem;display:flex;justify-content:center;gap:.5rem;flex-wrap:wrap}
.comm{display:inline-flex;align-items:center;gap:.45rem;border:1px solid var(--line);border-radius:var(--r-pill);padding:.4rem .95rem;font-size:.85rem;font-weight:500;color:var(--txt2);transition:.15s}
.comm:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
.comm svg{flex:none}

/* ===== Footer ===== */
footer.site{position:relative;z-index:2;margin-top:auto;border-top:1px solid var(--line-soft);background:var(--bg)}
.frow{padding:1.5rem 0 1.75rem;text-align:center}
.frow p.tag{font-size:.875rem;color:var(--mut)}
.frow p.built{margin-top:.4rem;font-size:.72rem;color:var(--dim)}
.frow p.built a:hover{color:var(--acc);text-decoration:underline;text-underline-offset:4px}
</style>
</head>

'use strict';

/* ===== Базовые пути =====
   404.html живёт в корне Pages-сайта репозитория CanvasDesk
   (project pages): все пути начинаются с /CanvasDesk/.
   Для нестандартного хостинга — фолбэк на корень. */
var BASE = (location.pathname === '/CanvasDesk' || location.pathname.indexOf('/CanvasDesk/') === 0) ? '/CanvasDesk/' : '/';
var APP  = BASE + 'app/';
var RETRY = 20; // секунд между проверками

/* Куда возвращать пользователя, когда деплой завершится.
   Сам путь /404.html не восстанавливаем — ведём на корень. */
var TARGET = /\/404\.html$/.test(location.pathname) ? BASE : location.pathname + location.search + location.hash;

/* ===== Режим для предпросмотра/отладки: ?state=rebuild|404 ===== */
var forceState = null;
try { var q = new URLSearchParams(location.search); forceState = q.get('state'); } catch(e) {}

/* ===== i18n ===== */
var L = {
  ru: {
    annRebuild: 'Идёт пересборка WASM — страница восстановится автоматически',
    ann404: 'Приложение онлайн — такой страницы на сайте нет',
    badgeRebuild: 'wasm · rebuild in progress',
    badge404: 'wasm · app online',
    headRebuild: 'Мы обновляем приложение',
    head404: 'Такой страницы нет',
    subRebuild: 'GitHub Pages сейчас отдаёт 404: публикуется новая сборка WebAssembly. Как только деплой завершится, эта страница сама проверит статус и вернёт вас в приложение — обновлять вручную не нужно.',
    sub404: 'Приложение уже работает, но по этому адресу страницы нет — возможно, ссылка устарела или в адресе опечатка. Откройте приложение или документацию по кнопкам ниже.',
    ln1Rebuild: 'app bundle: not published — Pages deploy in progress',
    ln1404: 'app: online ✓ · page: not found ✗',
    ln2Rebuild: 'reason: GitHub Pages отдаёт 404, пока публикуется новый бандл',
    ln2404: 'этот путь не существует — ссылка устарела или опечатка',
    ln3a: 'авто-проверка: повторим через ',
    ln3b: ' с',
    lnOk: '✓ приложение снова онлайн — переходим…',
    checkNow: 'проверить сейчас',
    btnApp: 'Открыть приложение',
    btnDocs: 'Документация',
    ask: 'Возникли вопросы? Спросите в сообществе — подскажем, в чём проблема:',
    footTag: 'Визуальная система математического моделирования. Открытый код, написан на Rust.',
    footBuilt: 'Сделано на Rust · wgpu · WebGPU · JSON Canvas'
  },
  en: {
    annRebuild: 'WASM rebuild in progress — this page will recover automatically',
    ann404: 'The app is online — this page does not exist',
    badgeRebuild: 'wasm · rebuild in progress',
    badge404: 'wasm · app online',
    headRebuild: 'We are updating the app',
    head404: 'Page not found',
    subRebuild: 'GitHub Pages is serving 404 while a new WebAssembly build is being deployed. As soon as the bundle is published, this page will re-check itself and take you back — no manual refresh needed.',
    sub404: 'The app is already running, but there is no page at this address — the link may be outdated or the URL has a typo. Open the app or the docs using the buttons below.',
    ln1Rebuild: 'app bundle: not published — Pages deploy in progress',
    ln1404: 'app: online ✓ · page: not found ✗',
    ln2Rebuild: 'reason: GitHub Pages serves 404 until the new bundle is published',
    ln2404: "this path doesn't exist — moved, renamed, or a typo",
    ln3a: 'auto-recheck: next attempt in ',
    ln3b: ' s',
    lnOk: '✓ app is back online — redirecting…',
    checkNow: 'check now',
    btnApp: 'Open the app',
    btnDocs: 'Documentation',
    ask: 'Questions? Ask the community — we will help you figure it out:',
    footTag: 'Visual mathematical modeling system. Open source, written in Rust.',
    footBuilt: 'Built with Rust · wgpu · WebGPU · JSON Canvas'
  }
};

var lang = 'en';
try {
  var saved = localStorage.getItem('cd_lang');
  var qLang = forceState ? null : new URLSearchParams(location.search).get('lang');
  lang = qLang || saved || ((navigator.language || 'en').toLowerCase().indexOf('ru') === 0 ? 'ru' : 'en');
  if (lang !== 'ru' && lang !== 'en') lang = 'en';
} catch(e) { lang = (navigator.language || 'en').toLowerCase().indexOf('ru') === 0 ? 'ru' : 'en'; }

function t(key){ return L[lang][key]; }

/* ===== Элементы ===== */
function el(id){ return document.getElementById(id); }
var E = {
  ann: el('annText'), badge: el('badge'), badgeText: el('badgeText'),
  head: el('headline'), sub: el('subText'), url: el('tUrl'),
  ln1: el('ln1'), ln2: el('ln2'), ln3a: el('ln3a'), ln3b: el('ln3b'),
  cd: el('cd'), lnOk: el('lnOk'), ctaApp: el('ctaApp'), ctaAppText: el('ctaAppText'),
  ctaDocs: el('ctaDocs'), ctaDocsText: el('ctaDocsText'),
  footTag: el('footTag'), footBuilt: el('footBuilt'),
  langPills: el('langPills'), logo: el('logoHome')
};

/* Проверить сейчас — ссылка добавляется под терминалом */
var checkNowLink = document.createElement('button');
checkNowLink.type = 'button';
checkNowLink.className = 'btn-link';
checkNowLink.addEventListener('click', function(){ if (mode !== 'ok') check(); });
E.ctaDocs.parentNode.insertBefore(checkNowLink, E.ctaDocs.nextSibling);

/* ===== Рендер ===== */
var mode = 'checking'; // checking | rebuild | notfound | ok
function render(){
  document.documentElement.lang = lang;
  E.ann.textContent      = (mode === 'notfound') ? t('ann404') : t('annRebuild');
  E.badge.className      = 'badge' + (mode === 'notfound' ? ' up' : '');
  E.badgeText.textContent = (mode === 'notfound') ? t('badge404') : t('badgeRebuild');
  E.head.textContent     = (mode === 'notfound') ? t('head404') : t('headRebuild');
  E.sub.textContent      = (mode === 'notfound') ? t('sub404') : t('subRebuild');
  E.ln1.textContent      = (mode === 'notfound') ? t('ln1404') : t('ln1Rebuild');
  E.ln1.className        = 'l' + (mode === 'notfound' ? '' : ' warn');
  E.ln2.textContent      = (mode === 'notfound') ? t('ln2404') : t('ln2Rebuild');
  E.ln2.className        = 'l mut';
  E.ln3a.textContent     = t('ln3a');
  E.ln3b.textContent     = t('ln3b');
  E.lnOk.textContent     = t('lnOk');
  E.ctaAppText.textContent = t('btnApp');
  E.ctaDocsText.textContent = t('btnDocs');
  el('askText').textContent = t('ask');
  E.footTag.textContent  = t('footTag');
  E.footBuilt.textContent = t('footBuilt');
  checkNowLink.textContent = '↻ ' + t('checkNow');
  checkNowLink.style.display = (mode === 'ok') ? 'none' : '';
  var rebuildish = (mode !== 'notfound');
  el('ln3wrap').style.display = rebuildish ? '' : 'none';
}

/* Язык и тема */
function setLang(l){ lang = l; try { localStorage.setItem('cd_lang', l); } catch(e) {} render(); markLang(); }
function markLang(){
  var bs = E.langPills.querySelectorAll('button');
  for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('on', bs[i].getAttribute('data-lang') === lang);
}
E.langPills.addEventListener('click', function(ev){
  var b = ev.target.closest('button[data-lang]');
  if (b) setLang(b.getAttribute('data-lang'));
});
el('themeBtn').addEventListener('click', function(){
  var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('cd_theme', next); } catch(e) {}
});

/* ===== Логика статуса =====
   1) Первая проверка: приложение поднялось?
      · да  → сайт жив, путь просто неверный → состояние «не найдено»
      · нет → пересборка → состояние «обновляемся» + обратный отсчёт
   2) Каждые RETRY секунд повторяем проверку; как только /app/
      отвечает 200 — показываем «снова онлайн» и возвращаем
      пользователя на исходный адрес (TARGET). */
var timer = null, left = RETRY, first = true;

function stopTimer(){ if (timer) { clearInterval(timer); timer = null; } }
function updCountdown(){ E.cd.textContent = left; }

function arm(){
  stopTimer();
  left = RETRY; updCountdown();
  timer = setInterval(function(){
    left--;
    if (left <= 0) { check(); return; }
    updCountdown();
  }, 1000);
}

function goOnline(){
  stopTimer();
  mode = 'ok';
  render();
  E.lnOk.hidden = false;
  setTimeout(function(){ location.replace(TARGET); }, 900);
}

function check(){
  stopTimer();
  var forced = forceState;
  if (forced === '404') { first = false; mode = 'notfound'; render(); return; }
  if (forced === 'rebuild') { first = false; mode = 'rebuild'; render(); arm(); return; }
  fetch(APP, { cache: 'no-store' }).then(function(r){
    if (r.ok) {
      if (first) { first = false; mode = 'notfound'; render(); }
      else { goOnline(); }
    } else {
      first = false; mode = 'rebuild'; render(); arm();
    }
  }).catch(function(){
    first = false; mode = 'rebuild'; render(); arm();
  });
}

/* ===== Инициализация ===== */
E.url.textContent = location.pathname + location.search;
E.ctaApp.href = APP;
E.ctaDocs.href = BASE;
E.logo.href = BASE;
markLang();
render();
check();
})();
</script>
</body>
</html>
